<script>
/* ════════════ B1.5 LAYER — record detail (note + history + chart) · masking scope · rent backfill ════════════ */

function setMaskScope(v){DB.settings.maskScope=v;save();applyMask();toast('Hiding: '+((MASK_SCOPES.find(s=>s[0]===v)||[])[1]||v));}

/* ── one addressing scheme for every record that can carry a note/history ── */
function getRec(path){
  const p=String(path||'').split(':');
  try{
    if(p[0]==='asset')  return DB.assets.data[p[1]][p[2]][Number(p[3])];
    if(p[0]==='rental') return DB.rental.records.find(r=>r.id===p[1]);
    if(p[0]==='tenant') return DB.rental.tenants.find(t=>t.id===p[1]);
    if(p[0]==='inst'){const pl=DB.payments.plans.find(x=>x.id===p[1]);return pl&&pl.installments.find(i=>i.id===p[2]);}
    if(p[0]==='plan')   return DB.payments.plans.find(x=>x.id===p[1]);
    if(p[0]==='plrow')  return (p[1]==='in'?DB.planner.incomings:DB.planner.outgoings).find(x=>x.id===p[2]);
    if(p[0]==='goal')   return DB.planner.goal;
  }catch(e){}
  return null;}
function recLabel(path){const r=getRec(path);if(!r)return 'Record';
  return r.desc||r.label||r.name||r.title||r.month||(r.date?fmtDate(r.date):'Record');}
function recValue(path){const r=getRec(path);if(!r)return null;
  const p=String(path).split(':')[0];
  if(p==='asset')return Number(r.amt)||0;
  if(p==='rental')return Number(r.received)||0;
  if(p==='tenant')return Number(r.contractRent)||0;
  if(p==='inst'||p==='plrow')return Number(r.amount)||0;
  if(p==='goal')return Number(r.amount)||0;
  return null;}

let DETAIL_PATH=null;
function openDetail(path){
  const rec=getRec(path);if(!rec){toast('Record not found',true);return;}
  DETAIL_PATH=path;
  const h=(rec.h||[]).slice().sort((a,b)=>String(a.d).localeCompare(String(b.d)));
  const note=String(rec.n||'');
  const rows=h.length?h.slice().reverse().map(p=>`<tr><td class="num">${p.d}</td><td class="num">${fmt(p.v)}</td></tr>`).join('')
    :'<tr><td colspan="2" class="muted" style="text-align:center;padding:10px">No history yet — it starts building the next time this value changes.</td></tr>';
  const span=h.length?`${h[0].d} → ${h[h.length-1].d===todayStr()?'today':h[h.length-1].d}`:'—';
  $('#modal').innerHTML=`<h3>${esc(recLabel(path))}</h3>
    <div class="desc">Notes and value history for this one record.</div>
    <label class="fl">Note</label>
    <div id="dt_view" class="noteview" onclick="dtEdit()" style="cursor:text">${note?esc(note):'<span class="muted">Click to write a note…</span>'}</div>

/* ════════════ C1 — money-weighted return (XIRR), Newton with a bisection safety net ════════════ */
/* Cashflows are {d:'YYYY-MM-DD', v:number}; money you PUT IN is negative, money OUT (or the closing
   value) is positive — the sign convention every spreadsheet XIRR uses. */
function xnpv(rate,flows,t0){
  if(rate<=-1)return NaN;
  return flows.reduce((s,f)=>{
    const yrs=(new Date(f.d+'T00:00:00')-t0)/(365*86400000);
    return s+f.v/Math.pow(1+rate,yrs);},0);}
function xirr(flows){
  if(!Array.isArray(flows)||flows.length<2)return null;
  const cl=flows.filter(f=>f&&f.d&&isFinite(f.v)&&f.v!==0)
    .map(f=>({d:String(f.d).slice(0,10),v:Number(f.v)}))
    .sort((a,b)=>a.d.localeCompare(b.d));
  if(cl.length<2)return null;
  if(!cl.some(f=>f.v>0)||!cl.some(f=>f.v<0))return null; /* one-directional flows have no rate of return */
  if((new Date(cl[cl.length-1].d+'T00:00:00')-new Date(cl[0].d+'T00:00:00'))/86400000<30)return null; /* under a month cannot be annualised honestly — a 5% gain over 17 days is not 14,000%/yr */
  const t0=new Date(cl[0].d+'T00:00:00');
  let r=0.1;
  for(let i=0;i<60;i++){
    const f=xnpv(r,cl,t0);if(!isFinite(f))break;
    const dr=1e-5,f2=xnpv(r+dr,cl,t0);if(!isFinite(f2))break;
    const slope=(f2-f)/dr;if(!slope)break;
    const next=r-f/slope;
    if(!isFinite(next)||next<=-0.9999){r=(r-0.9999)/2;continue;}
    if(Math.abs(next-r)<1e-9){r=next;break;}
    r=next;}
  if(isFinite(r)&&Math.abs(xnpv(r,cl,t0))<1e-4)return r;
  /* Newton wandered off — bracket and bisect, which cannot diverge */
  let lo=-0.9999,hi=1e4,flo=xnpv(lo,cl,t0),fhi=xnpv(hi,cl,t0);
  if(!isFinite(flo)||!isFinite(fhi)||flo*fhi>0)return null;
  for(let i=0;i<300;i++){const mid=(lo+hi)/2,fm=xnpv(mid,cl,t0);
    if(!isFinite(fm))return null;
    if(Math.abs(fm)<1e-6)return mid;
    if(flo*fm<0){hi=mid;fhi=fm;}else{lo=mid;flo=fm;}}
  return (lo+hi)/2;}
function fundFlows(name){
  if(DB.funds.transactions.some(t=>t.fund===name&&t.dateUnknown))return[]; /* a guessed date would be a guessed return */
  const out=DB.funds.transactions.filter(t=>t.fund===name)
    .map(t=>({d:t.date,v:t.type==='BUY'?-(Number(t.net)||0):(Number(t.net)||0)}));
  const h=holdingsArray().find(x=>x.fund===name);
  if(h&&h.units>0.0001)out.push({d:todayStr(),v:h.currentValue});
  return out;}
function fundXIRR(name){const r=xirr(fundFlows(name));return r==null?null:r*100;}
function portfolioFlows(){
  if(DB.funds.transactions.some(t=>t.dateUnknown))return[];
  const out=DB.funds.transactions.map(t=>({d:t.date,v:t.type==='BUY'?-(Number(t.net)||0):(Number(t.net)||0)}));
  const v=fundsValueEGP();if(v>0)out.push({d:todayStr(),v});

function portfolioXIRR(){const r=xirr(portfolioFlows());return r==null?null:r*100;}
/* Net worth: snapshots give the valuations, DB.flows gives the money you added or took out.
   Without recorded flows an XIRR is not defined, so we say so instead of inventing one. */
function nwReturn(){
  const snaps=(DB.snapshots||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(snaps.length<2)return{kind:'none',reason:'Needs at least two snapshots — take one from the menu.'};
  const first=snaps[0],nowV=netWorth().egp;
  const flows=[{d:first.date,v:-first.egp}];
  (DB.flows||[]).filter(f=>f.date>first.date).forEach(f=>flows.push({d:f.date,v:-(Number(f.amount)||0)}));
  flows.push({d:todayStr(),v:nowV});
  const r=xirr(flows);
  const yrs=(new Date(todayStr()+'T00:00:00')-new Date(first.date+'T00:00:00'))/(365*86400000);
  const cagr=(yrs>0&&first.egp>0)?(Math.pow(nowV/first.egp,1/yrs)-1)*100:null;
  if((DB.flows||[]).length&&r!=null)return{kind:'xirr',pct:r*100,since:first.date,cagr};
  return{kind:'cagr',pct:cagr,since:first.date,
    reason:'No deposits or withdrawals recorded, so this is growth between snapshots — not a money-weighted return.'};}

const SRC_TIMEOUT=8000;
async function fetchOnce(url){
  const ctl=(typeof AbortController!=='undefined')?new AbortController():null;
  const t=setTimeout(()=>{try{ctl&&ctl.abort();}catch(e){}},SRC_TIMEOUT);
  try{const res=await fetch(url,ctl?{signal:ctl.signal}:undefined);
    if(!res.ok)throw new Error('HTTP '+res.status);
    return await res.text();}
  finally{clearTimeout(t);}}
async function srcFetch(url){
  try{return await fetchOnce(url);}
  catch(e){
    const pb=(DB.settings&&DB.settings.proxyBase||'').trim();
    if(pb&&classifyErr(e).status==='blocked'){
      /* second chance through the user's own proxy (e.g. a Netlify function) — same origin, no CORS */
      return await fetchOnce(pb+(pb.includes('?')?'&':'?')+'u='+encodeURIComponent(url));}
    throw e;}}

function allSources(){
  const custom=(DB.settings.customSources||[]).map(c=>({
    id:c.id,name:c.name+' (yours)',kind:c.kind||'fund',keyless:true,custom:true,note:c.note||c.url,
    run:async()=>{const txt=await srcFetch(c.url);
      let val=null;
      try{const j=JSON.parse(txt);
        val=String(c.path||'').split('.').filter(Boolean).reduce((o,k)=>(o==null?o:o[/^\d+$/.test(k)?Number(k):k]),j);}
      catch(e){const m=String(txt).match(/-?\d+(?:\.\d+)?/);val=m?Number(m[0]):null;}
      if(!isFinite(Number(val))||Number(val)<=0)throw new Error('endpoint gave no usable number');
      return{type:'quote',cur:c.cur||'EGP',prices:{[c.symbol||c.id]:Number(val)}};}}));
  return PRICE_SOURCES.concat(custom);}
function srcState(id){return (DB.settings.sources||{})[id]||{status:'idle'};}
function setSrcState(id,st){DB.settings.sources=DB.settings.sources||{};
  DB.settings.sources[id]=Object.assign({},DB.settings.sources[id],st);}
function classifyErr(e){
  const m=String((e&&e.message)||e||'');
  if(/Failed to fetch|NetworkError|CORS|Load failed|blocked/i.test(m))return{status:'blocked',
    why:'Your browser blocked this endpoint (CORS). Prices stay manual for it.'};
  if(/abort/i.test(m))return{status:'err',why:'Timed out after 8 seconds.'};
  return{status:'err',why:m||'Unknown error'};}
function boundSymbols(kind){
  const out=[];
  if(kind==='stock'||kind==='crypto'){
    DB.assets.categories.forEach(c=>{const cd=DB.assets.data[c.id]||{};
      Object.keys(cd).forEach(cur=>(cd[cur]||[]).forEach(it=>{
        if(it.bind&&it.bind.kind===kind&&it.bind.symbol)out.push(it.bind.symbol);}));});
    Object.keys(DB.funds.bind||{}).forEach(f=>{const b=DB.funds.bind[f];
      if(b&&b.kind===kind&&b.symbol)out.push(b.symbol);});}
  return Array.from(new Set(out));}
async function runSource(id,opts){
  const s=allSources().find(x=>x.id===id);if(!s)return{ok:false,why:'no such source'};
  try{
    const res=await s.run(boundSymbols(s.kind));
    applyQuotes(s,res,opts);
    setSrcState(id,{status:'ok',lastOk:new Date().toISOString(),why:''});
    return{ok:true,res};
  }catch(e){const c=classifyErr(e);setSrcState(id,{status:c.status,lastErr:new Date().toISOString(),why:c.why});
    return{ok:false,why:c.why,status:c.status};}}
/* A source never writes a zero and never invents a value for something you did not bind. */
function applyQuotes(s,res,opts){
  if(!res)return;
  if(res.type==='fx'){
    Object.keys(res.rates||{}).forEach(c=>{const v=Number(res.rates[c]);
      if(isFinite(v)&&v>0&&DB.rates[c]!==undefined)DB.rates[c]=Math.round(v*100)/100;});
    DB.settings.ratesUpdated=todayStr();return;}
  if(res.type==='quote'){
    const px=res.prices||{},usd=DB.rates.USD||1;
    Object.keys(DB.funds.bind||{}).forEach(f=>{const b=DB.funds.bind[f];
      if(!b||b.src!==s.id||!px[b.symbol])return;
      const p=Number(px[b.symbol])*(res.cur==='USD'?usd:1);
      if(!(p>0))return;
      DB.funds.currentPrices[f]=Math.round(p*10000)/10000;
      const arr=DB.funds.priceHistory[f]=DB.funds.priceHistory[f]||[];
      const i=arr.findIndex(e=>e.date===todayStr());
      if(i>=0){arr[i].price=DB.funds.currentPrices[f];arr[i].u=todayStr();arr[i].src=s.id;}
      else arr.push({date:todayStr(),price:DB.funds.currentPrices[f],u:todayStr(),src:s.id});});
    DB.assets.categories.forEach(c=>{const cd=DB.assets.data[c.id]||{};
      Object.keys(cd).forEach(cur=>(cd[cur]||[]).forEach(it=>{
        const b=it.bind;if(!b||b.src!==s.id||!px[b.symbol])return;
        const unit=Number(px[b.symbol]);if(!(unit>0))return;
        const qty=Number(b.qty)||0;if(!(qty>0))return;
        const raw=unit*qty;
        /* a USD quote has to be walked into the row's own currency via EGP, or a €-row silently records $ */
        let val=raw;
        if(res.cur==='USD'&&cur!=='USD'){const egp=raw*(DB.rates.USD||1);val=(cur==='EGP')?egp:egp/(DB.rates[cur]||1);}
        else if(res.cur&&cur!==res.cur&&DB.rates[res.cur]){const egp=raw*(DB.rates[res.cur]||1);val=(cur==='EGP')?egp:egp/(DB.rates[cur]||1);}
        it.amt=Math.round(val*100)/100;it.u=todayStr();it.pxSrc=s.id;
        if(res.proxy)it.pxProxy=true;
        stampHist(it,it.amt);}));});}}

    const r=await runSource(id);

  if(manual)toast(ok+' source'+(ok===1?'':'s')+' updated'+(blocked?' · '+blocked+' blocked by the browser':'')+(failed?' · '+failed+' failed':''),!ok);
  return{ok,blocked,failed};}

    a.download=fname;a.click();stampExport();toast('Saved '+fname);}

  try{const k='__wos_probe';localStorage.setItem(k,'1');STORAGE_OK=localStorage.getItem(k)==='1';localStorage.removeItem(k);}
  catch(e){STORAGE_OK=false;}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  return STORAGE_OK;}
function storageLine(){
  if(STORAGE_OK===false)return '⚠️ this browser is NOT keeping your data — export a backup now and open the app in Safari or on your own domain';
  return 'stored on this device · ' + (function(){try{return Math.round((localStorage.getItem(KEY)||'').length/1024)+' KB used';}catch(e){return 'size unknown';}})();}

/* ── force update: clear what a browser actually caches, then reload the same URL ── */
async function forceUpdate(){
  toast('Clearing cache…');
  try{if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister();}}catch(e){}
  try{if(window.caches){const ks=await caches.keys();for(const k of ks)await caches.delete(k);}}catch(e){}
  try{location.reload();}catch(e){toast('Reload manually to finish',true);} /* never rewrite the URL — a ?v= querystring 404s inside in-app browsers */}

/* ── erase everything, deliberately: confirm → typed code → final confirm ── */
let ERASE_CODE=null;
async function openEraseGate(){
  if(!await confirmGlass('Erase all data','This wipes every asset, fund, tenant, plan, note and history on this device. Your backups and any synced vault are not touched.',true))return;
  ERASE_CODE=String(Math.floor(100000+Math.random()*900000));
  $('#modal').innerHTML=`<h3>Type the code to erase</h3>
    <div class="desc">This step exists so this can never happen by accident.</div>
    <div class="paircode" style="font-size:26px;text-align:center;letter-spacing:.3em;-webkit-user-select:none;user-select:none">${ERASE_CODE}</div>
    <label class="fl" style="margin-top:12px">Type the six digits above</label>
    <input class="inp num" id="er_in" inputmode="numeric" maxlength="6" placeholder="______" autocomplete="off">
    <label class="wizrow" style="margin-top:10px"><input type="checkbox" id="er_sync"><span class="wl">Also disconnect sync on this device</span></label>
    <div class="warnbox">There is no undo after the final step. If you are unsure, close this and export a backup first.</div>
    <div class="mfoot"><button class="btn gho" onclick="closeModal()">Cancel</button><button class="btn dang" onclick="eraseGo()">Continue</button></div>`;
  $('#scrim').classList.add('on');}
async function eraseGo(){
  const v=String(($('#er_in')||{}).value||'').trim();
  if(v!==ERASE_CODE){toast('That code does not match',true);return;}
  const alsoSync=!!($('#er_sync')&&$('#er_sync').checked);
  if(!await confirmGlass('Final check','Erase everything on this device now?',true))return;
  try{localStorage.removeItem(KEY);localStorage.removeItem(SB_KEY);if(alsoSync){localStorage.removeItem('wos_synccfg');if(Sync.disconnect)Sync.disconnect();}}catch(e){}
  ERASE_CODE=null;UNDO=null;DB=migrate(emptyDB());save();closeModal();
  applyTheme();applyPrivacy();renderActive();updateBadges();refreshUndo();
  toast('Everything erased — starting fresh');}

/* ── the greeting is regenerated, never left to rot at yesterday's number ── */
function refreshBrief(){
  if(!DB.chat.length||!DB.chat[0].auto)return;
  const h=new Date().getHours();const greet=h<5?'Up late':h<12?'Good morning':h<18?'Good afternoon':'Good evening';
  const nm=DB.settings.name?', '+DB.settings.name:'';
  const last=DB.snapshots[DB.snapshots.length-1];const n=netWorth();
  let line=greet+nm+' ☀️ Net worth is '+fmt(n.egp)+' EGP (≈ '+fmt(n.usd)+' USD). Ask me anything, or paste a table.';
  if(last)line=greet+nm+' ☀️ You’re '+(n.egp-last.egp>=0?'up':'down')+' '+fmt(Math.abs(n.egp-last.egp))+' EGP since '+last.date+' — net worth '+fmt(n.egp)+' EGP. Ask away, or paste a table.';
  DB.chat[0].text=line;}
function bfCommit(){
  const rows=bfPlan();if(!rows.length){toast('Nothing to add',true);return;}
  const tenantId=$('#bf_ten').value;snapUndo();
  rows.forEach(r=>DB.rental.records.push(stampHist({id:uid(),month:r.month,tenantId,received:r.received,expected:r.expected,
    mortgage:r.mortgage,note:'',expenses:r.expenses,n:'Backfilled '+todayStr(),u:todayStr()},r.received)));
  DB.rental.records.sort((a,b)=>a.month.localeCompare(b.month));
  closeModal();persist();toastUndo(rows.length+' months backfilled');}
</script>
