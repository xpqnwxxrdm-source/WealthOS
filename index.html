$('#scrim').addEventListener('click',e=>{if(e.target===$('#scrim'))closeModal();});

/* ════════════ THEME ════════════ */
function applyTheme(){const lt=DB.settings.theme==='light';document.documentElement.dataset.theme=lt?'light':'dark';document.documentElement.dataset.look=(DB.settings.look==='atelier')?'atelier':'glass';if(typeof applyPalette==='function')applyPalette();
  $('#themeBtn').innerHTML=lt?ICO_SUN:ICO_MOON;}
function toggleTheme(){DB.settings.theme=DB.settings.theme==='light'?'dark':'light';save();applyTheme();renderActive();}

/* ════════════ LIVESYNC — E2E-encrypted Supabase vault (ported crypto) ════════════ */
const Sync=(()=>{
  const te=new TextEncoder(),td=new TextDecoder();
  const b64e=b=>{let s='';new Uint8Array(b).forEach(x=>s+=String.fromCharCode(x));return btoa(s);};
  const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  let cfg=JSON.parse(localStorage.getItem('wos_synccfg')||'null');
  let meta=JSON.parse(localStorage.getItem('wos_syncmeta')||'{"localModifiedAt":0,"lastSeenRemote":0,"dirty":false}');
  let key=null,vaultId=null,busy=false,queued=false,timer=null;
  function saveMeta(){localStorage.setItem('wos_syncmeta',JSON.stringify(meta));}
  function setDot(s){const d=$('#syncDot'),t=$('#syncTxt');d.className='dot '+s;
    t.textContent=s==='ok'?'Synced':s==='busy'?'Syncing…':s==='err'?'Sync error':cfg?'Reconnect':'Sync off';}
  async function deriveKey(p){const km=await crypto.subtle.importKey('raw',te.encode(p),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:te.encode('wos-sync-v1'),iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
  async function deriveVault(p){const d=await crypto.subtle.digest('SHA-256',te.encode('wos-vault:'+p));return[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('');}
  async function encrypt(obj){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj)));return b64e(iv)+'.'+b64e(ct);}
  async function decrypt(s){const p=s.split('.');const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(p[0])},key,b64d(p[1]));return JSON.parse(td.decode(pt));}
  const base=()=>cfg.url.replace(/\/+$/,'')+'/rest/v1/vaults';
  const hdr=()=>({'apikey':cfg.anonKey,'Authorization':'Bearer '+cfg.anonKey,'Content-Type':'application/json'});
  async function fetchRemote(){const r=await fetch(base()+'?id=eq.'+vaultId+'&select=data',{headers:hdr()});if(!r.ok)throw new Error('read failed ('+r.status+')');const rows=await r.json();return rows.length?decrypt(rows[0].data):null;}
  async function pushRemote(){if(DB.settings&&DB.settings.sandbox)return; /* B1: sandbox data never syncs */
    const payload=Object.assign({},DB,{modifiedAt:meta.localModifiedAt||Date.now(),__wealthos:true});
    const data=await encrypt(payload);const r=await fetch(base(),{method:'POST',headers:Object.assign(hdr(),{'Prefer':'resolution=merge-duplicates'}),
      body:JSON.stringify([{id:vaultId,data,updated_at:new Date().toISOString()}])});if(!r.ok)throw new Error('write failed ('+r.status+')');
    meta.dirty=false;meta.lastSeenRemote=payload.modifiedAt;saveMeta();}
  function decision(localMod,remoteMod,dirty,lastSeen){if(remoteMod===null)return(dirty||localMod>0)?'push':'none';
    if(remoteMod===localMod)return dirty?'push':'none';if(remoteMod>localMod)return(dirty&&remoteMod>lastSeen)?'conflict':'pull';return dirty?'push':'none';}
  function applyRemote(st){const incoming=migrate(st);Object.keys(incoming).forEach(k=>{if(k!=='__wealthos')DB[k]=incoming[k];});
    localStorage.setItem(KEY,JSON.stringify(DB));meta.localModifiedAt=st.modifiedAt||Date.now();meta.lastSeenRemote=st.modifiedAt||0;meta.dirty=false;saveMeta();applyTheme();renderActive();updateBadges();}
  async function now(){if(!key||!cfg)return;if(busy){queued=true;return;}busy=true;setDot('busy');
    try{const remote=await fetchRemote();const rMod=remote?(remote.modifiedAt||0):null;
      const d=decision(meta.localModifiedAt||0,rMod,!!meta.dirty,meta.lastSeenRemote||0);
      if(d==='push')await pushRemote();else if(d==='pull')applyRemote(remote);
      else if(d==='conflict'){const keepCloud=await confirmGlass('Sync conflict','This device and the cloud both changed since the last sync. Keep the cloud copy (replaces this device) or keep this device (overwrites cloud)?');if(keepCloud)applyRemote(remote);else await pushRemote();}
      setDot('ok');}catch(e){setDot('err');console.warn('sync',e);}finally{busy=false;if(queued){queued=false;now();}}}
  return{
    hasCfg:()=>!!cfg, isOn:()=>!!key,
    init(){if(cfg&&cfg.pass){deriveKey(cfg.pass).then(k=>{key=k;}).then(()=>deriveVault(cfg.pass)).then(id=>{vaultId=id;setDot('ok');now();startPoll();});}else setDot(cfg?'off':'off');},
    markDirty(){meta.localModifiedAt=Date.now();meta.dirty=true;saveMeta();if(key){clearTimeout(timer);timer=setTimeout(now,1200);}},
    async connect(url,anonKey,pass){cfg={url,anonKey,pass};localStorage.setItem('wos_synccfg',JSON.stringify(cfg));
      key=await deriveKey(pass);vaultId=await deriveVault(pass);meta.dirty=true;saveMeta();await now();startPoll();},
    disconnect(){cfg=null;key=null;vaultId=null;localStorage.removeItem('wos_synccfg');clearInterval(pollTimer);setDot('off');},
    statusText(){return!cfg?'Not connected.':key?'Connected — your data syncs end-to-end encrypted across devices using this passphrase.':'Config saved — enter passphrase to reconnect.';}
  };
  function startPoll(){clearInterval(pollTimer);pollTimer=setInterval(()=>{if(!document.hidden)now();},20000);}
  var pollTimer;
})();
</script>
<script>
/* ════════════ RENDER HELPERS ════════════ */
function secHead(eye,title,acts){return `<div class="sec"><span class="eye">${eye}</span><h2>${esc(title)}</h2><span class="ln"></span><span class="act">${acts||''}</span></div>`;}
function statCard(o){const sv=o.sub?`<div class="s ${o.scls||''}">${o.sub}</div>`:'';const go=o.goto?` onclick="switchTab('${o.goto}')" style="cursor:pointer"`:'';const chev=o.goto?'<span class="gochev">›</span>':'';

function collectFlags(){const per={assets:0,funds:0,rental:0,payments:0,planner:0};const perRed={},perWhy={},perEx={};let red=0,amber=0;
  const add=(f,tab,label)=>{if(!f)return;if(f.level==='red'){red++;perRed[tab]=(perRed[tab]||0)+1;}else amber++;per[tab]++;
    const w=perWhy[tab]=perWhy[tab]||{};const c=f.code||'other';w[c]=(w[c]||0)+1;
    const ex=perEx[tab]=perEx[tab]||[];if(label&&ex.length<3&&!ex.includes(label))ex.push(String(label));};
  DB.assets.categories.forEach(c=>{const cd=DB.assets.data[c.id]||{};
    Object.keys(cd).forEach(cur=>(cd[cur]||[]).forEach(it=>add(flagFor(it,'asset'),'assets',it.desc)));});
  DB.funds.transactions.forEach(t=>add(flagFor(t,'tx'),'funds',t.type+' '+t.fund));
  Object.keys(DB.funds.priceHistory||{}).forEach(n=>(DB.funds.priceHistory[n]||[]).forEach(p=>add(flagFor(p,'price'),'funds',n+' '+p.date)));
  rentalRows().forEach(r=>add(flagFor(r,'rental'),'rental',r.month));
  DB.rental.tenants.forEach(t=>add(flagFor(t,'tenant'),'rental',t.name));
  DB.payments.plans.forEach(p=>{add(flagFor(p,'plan'),'payments',p.title);p.installments.forEach(i=>add(flagFor(i,'inst'),'payments',p.title+' '+i.date));});
  DB.planner.incomings.concat(DB.planner.outgoings).forEach(x=>add(flagFor(x,'plrow'),'planner',x.label));
  return{red,amber,per,perRed,perWhy,perEx};}

      <table class="tbl"><thead><tr><th>Paid</th><th>Due</th><th>Amount</th><th class="l">What it's for</th><th class="l">Note & history</th><th></th></tr></thead><tbody>${insts||'<tr><td colspan="6" class="muted" style="text-align:center;padding:12px">No installments</td></tr>'}</tbody></table>
      <div class="row" style="margin-top:10px"><input class="inp num" id="pi_${p.id}_d" type="date" value="${todayStr()}" style="max-width:170px"><input class="inp num" id="pi_${p.id}_a" placeholder="Amount" style="flex:1"><input class="inp" id="pi_${p.id}_n" placeholder="Note" style="flex:1"><button class="btn sm" onclick="payAddInst('${p.id}')">＋ Installment</button><button class="btn sm gho" onclick="openInstGen('${p.id}')">⟳ Generate schedule</button></div></div>`;});

<script>
/* ════════════ PLANNER (2-in-1 cashflow) ════════════ */
function addMonths(d,n){const x=new Date(d);x.setMonth(x.getMonth()+n);return x;}
function monthlyRentIn(){return DB.rental.tenants.reduce((s,t)=>s+(Number(t.contractRent)||0),0);}
function monthlyMortgageOut(){const byT={};DB.rental.records.slice().sort((a,b)=>a.month.localeCompare(b.month)).forEach(r=>{byT[r.tenantId]=Number(r.mortgage)||0;});
  return Object.values(byT).reduce((s,v)=>s+v,0);}
function startCash(){if(DB.planner.startCashOverride!=null)return DB.planner.startCashOverride;return assetsTotals().byCat['cash']||0;}
function projectFlows(months){const rows=[];let bal=startCash();const base=new Date();base.setDate(1);
  const rin=monthlyRentIn(),mout=monthlyMortgageOut();
  for(let i=0;i<months;i++){const d=addMonths(base,i),key=monthStr(d);
    const inMan=DB.planner.incomings.filter(x=>monthStr(x.date)===key).reduce((s,x)=>s+(Number(x.amount)||0),0);
    const outMan=DB.planner.outgoings.filter(x=>monthStr(x.date)===key).reduce((s,x)=>s+(Number(x.amount)||0),0);
    const inst=allInstallments().filter(x=>!x.paid&&monthStr(x.date)===key).reduce((s,x)=>s+(Number(x.amount)||0),0);
    const rec=recurringFlowsFor(key);const rcost=rentalCostForMonth(key);
    const tin=rin+inMan+rec.in,tout=mout+outMan+inst+rec.out+rcost,net=tin-tout;bal+=net;
    rows.push({key,in:tin,out:tout,net,bal});}
  return rows;}
function flowTable(rows){return `<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Month</th><th>In</th><th>Out</th><th>Net</th><th>Balance</th></tr></thead><tbody>`+
  rows.map(r=>`<tr><td class="num">${r.key}</td><td class="num pos">${fmt(r.in)}</td><td class="num neg">${fmt(r.out)}</td><td class="num ${r.net>=0?'pos':'neg'}">${signed(r.net)}</td><td class="num ${r.bal<0?'neg':''}">${fmt(r.bal)}</td></tr>`).join('')+
  `</tbody></table></div>`;}
function renderPlanner(){
  const sc=startCash();const short=projectFlows(6),long=projectFlows(24);
  const sLow=Math.min(...short.map(r=>r.bal)),sIn=short.reduce((s,r)=>s+r.in,0),sOut=short.reduce((s,r)=>s+r.out,0);
  const lNet=long.reduce((s,r)=>s+r.net,0),lLow=Math.min(...long.map(r=>r.bal));
  let runway='24+ mo';for(let i=0;i<long.length;i++){if(long[i].bal<0){runway=i+' mo';break;}}
  const nw=netWorth();
  const manRows=(arr,kind)=>arr.length?arr.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<tr><td class="l">${esc(x.label)}${flagIcon(flagFor(x,'plrow'))}<div class="udate">${x.u||'—'}</div></td><td class="num">${fmtDate(x.date)}</td><td class="num ${kind==='in'?'pos':'neg'}">${fmt(x.amount)}</td><td class="l">${noteChip(`plrow:${kind}:${x.id}`,x.n)}${histBadge(x)}</td><td><button class="x" onclick="plDel('${kind}','${x.id}')">✕</button></td></tr>`).join(''):'<tr><td colspan="5" class="muted" style="text-align:center;padding:10px">none</td></tr>';
  $('#plBody').innerHTML=
    secHead('Planner','Short & long-term cashflow',`<span class="muted" style="font-size:11px">Pulls rent, mortgage & scheduled payments automatically</span>`)+
    `<div class="panel glass"><div class="ph"><h3>Baseline (auto)</h3><span class="sp"></span><span class="muted" style="font-size:11px">live from your real data</span></div>
      <div class="row"><div class="field" style="flex:1"><label>Starting cash (EGP) — defaults to your Cash category</label><input class="inp num" value="${fmt(sc)}" onchange="plSetStart(this.value)"></div>
      <div class="kpi-mini" style="flex:2"><div class="m">Recurring rent / mo<b class="num pos">${fmt(monthlyRentIn())}</b></div><div class="m">Mortgage / mo<b class="num neg">${fmt(monthlyMortgageOut())}</b></div><div class="m">Net worth<b class="num">${shortN(nw.egp)}</b></div></div></div></div>`+
    goalPanel()+nwReturnPanel()+flowsPanel()+planRecPanel()+`<div class="panel glass" id="panel_whatif" style="border-left:3px solid var(--amber)"><div class="ph"><span class="swatch" style="background:var(--amber)"></span><h3>Scenario — what-if</h3><span class="tag">${DB.planner.incomings.length+DB.planner.outgoings.length} temp item${(DB.planner.incomings.length+DB.planner.outgoings.length)===1?'':'s'}</span><span class="sp"></span>${sandboxOn()?'':`<button class="btn sm" onclick="sandboxStart()">🧪 Sandbox</button>`}<button class="btn sm dang" onclick="plResetScenario()">⟲ Reset scenario</button></div>

<script>
/* ════════════ UNIFIED ASSISTANT ════════════ */
function fuzzyFund(names,q){const s=q.trim().toLowerCase();let m=names.find(n=>n.toLowerCase()===s);if(m)return{match:m,options:[]};
  let opts=names.filter(n=>n.toLowerCase().startsWith(s));if(opts.length===1)return{match:opts[0],options:[]};
  if(!opts.length)opts=names.filter(n=>n.toLowerCase().includes(s));if(opts.length===1)return{match:opts[0],options:[]};
  return{match:null,options:opts};}
function findAssetItems(q){const s=q.trim().toLowerCase();const hits=[];DB.assets.categories.forEach(c=>{const cd=DB.assets.data[c.id]||{};
  Object.keys(cd).forEach(cur=>{(cd[cur]||[]).forEach((it,idx)=>{if(it.desc.toLowerCase().includes(s))hits.push({cat:c,cur,idx,it});});});});return hits;}
function fuzzyCat(q){if(!q)return null;const s=q.trim().toLowerCase();return DB.assets.categories.find(c=>c.name.toLowerCase().includes(s)||c.id===s)||null;}

function parseUnified(text){const t=text.trim(),low=t.toLowerCase();
  if(/^(help|\?|commands?|what can you do)$/.test(low))return{kind:'help'};
  let m=t.match(/^(buy|bought|sell|sold)\s+([\d.,]+)\s+(.+?)\s*(?:@|\bat\b)\s*([\d.,]+)(?:\s+fees?\s*([\d.,]+))?(?:\s+on\s+(\d{4}-\d{2}-\d{2}))?\s*$/i);
  if(m)return{kind:'fundtx',type:/^b/i.test(m[1])?'BUY':'SELL',units:parseAmt(m[2]),fundQ:m[3].trim(),price:parseAmt(m[4]),fee:m[5]?parseAmt(m[5]):0,date:m[6]||todayStr()};
  m=t.match(/^(?:add|new)\s+fund\s+(.+)$/i);if(m)return{kind:'addfund',name:m[1].trim()};
  m=low.match(/^(?:set\s+)?(usd|eur|aed)\s*(?:rate)?\s*(?:to|=|at)?\s*([\d.,]+)\s*$/);if(m&&/\brate\b|^set\s/.test(low))return{kind:'setrate',cur:m[1].toUpperCase(),val:parseAmt(m[2])};
  m=t.match(/^price\s+(.+?)\s+([\d.,]+)\s*$/i);if(m)return{kind:'fundprice',fundQ:m[1].trim(),price:parseAmt(m[2])};
  m=t.match(/^(?:add|new|got|put)\s+([\d.,]+)\s*(egp|usd|eur|aed)?\s+(.+?)(?:\s+(?:to|in|into|under)\s+(.+))?$/i);
  if(m)return{kind:'assetadd',amt:parseAmt(m[1]),cur:m[2]?m[2].toUpperCase():null,desc:m[3].trim(),catQ:m[4]?m[4].trim():null};
  m=t.match(/^(?:update|set)\s+(.+?)\s+(?:to|=)\s*([\d.,]+)\s*(egp|usd|eur|aed)?\s*$/i);if(m)return{kind:'assetupd',q:m[1].trim(),amt:parseAmt(m[2])};
  m=t.match(/^(?:delete|remove)\s+(.+)$/i);if(m)return{kind:'assetdel',q:m[1].trim()};
  if(/^(net ?worth|summary|total|status|worth|how much)\b/.test(low))return{kind:'summary'};
  if(/^(breakdown|allocation|alloc|weights?|distribution)\b/.test(low))return{kind:'breakdown'};
  if(/^snapshot|^snap|^record/.test(low))return{kind:'snapshot'};
  if(/^(holdings?|positions?)\b/.test(low))return{kind:'holdings'};
  if(/^(best|top|winner)/.test(low))return{kind:'best'};
  if(/^(worst|loser)/.test(low))return{kind:'worst'};
  if(/^fees?\b/.test(low))return{kind:'fees'};
  if(/^realized/.test(low))return{kind:'realized'};
  if(/^rates?\b/.test(low))return{kind:'rates'};
  if(/^(upcoming|due|payments?)\b/.test(low))return{kind:'upcoming'};
  return{kind:'unknown'};
}
const A=(t)=>({role:'agent',kind:'text',text:t});
function execUnified(it){
  switch(it.kind){
    case 'help':return{msgs:[A('Ask in plain words, or paste a table from Numbers. Examples: “net worth”, “usd balance”, “breakdown”, “buy 100 Osoul @ 962”, “add 5000 usd NVDA to stocks”, “add 5000 for rent and 3000 for expenses”, “when was Osoul purchased”, “how much is NVDA worth”, “price Takamol 655”, “set usd 51”, “upcoming”, “snapshot”.')]};
    case 'summary':{const n=netWorth();return{msgs:[A('Net worth: '+fmt(n.egp)+' EGP (≈ '+fmt(n.usd)+' USD). Assets '+shortN(n.assetsEgp)+', funds '+shortN(n.fundsEgp)+'.')]};}
    case 'breakdown':{return{msgs:[A('Your allocation right now:'),{role:'agent',kind:'card',card:'alloc',items:allocation()}]};}
    case 'holdings':{const p=portfolioStats();const r=p.arr.filter(h=>h.units>0.01);if(!r.length)return{msgs:[A('No open fund positions yet.')]};return{msgs:[A('Open positions:'),{role:'agent',kind:'card',card:'holdings',rows:r}]};}
    case 'best':case 'worst':{const p=portfolioStats();const r=p.arr.filter(h=>h.units>0.01).sort((a,b)=>b.returnPct-a.returnPct);if(!r.length)return{msgs:[A('No positions to rank.')]};const h=it.kind==='best'?r[0]:r[r.length-1];return{msgs:[A((it.kind==='best'?'Best performer: ':'Weakest performer: ')+h.fund+' at '+pct(h.returnPct)+' ('+signed(h.unrealizedPL)+' EGP unrealized).')]};}
    case 'fees':{return{msgs:[A('Total fund fees paid: '+fmt(portfolioStats().fees)+' EGP.')]};}
    case 'realized':{return{msgs:[A('Realized fund P/L to date: '+signed(portfolioStats().rpl)+' EGP.')]};}
    case 'rates':{return{msgs:[A('Rates (EGP per unit): '+['USD','EUR','AED'].map(c=>FLAGS[c]+' '+c+' '+fmt(DB.rates[c])).join(' · ')+'.')]};}
    case 'upcoming':{const u=upcomingPayments(90);if(!u.length)return{msgs:[A('Nothing due in the next 90 days.')]};return{msgs:[A('Due in the next 90 days:'),{role:'agent',kind:'card',card:'upcoming',rows:u.slice(0,8)}],}; }
    case 'snapshot':{const upd=recordSnapshot();return{changed:true,msgs:[A((upd?'Updated today’s snapshot 📸':'Snapshot saved 📸')+' — net worth '+fmt(netWorth().egp)+' EGP.')]};}
    case 'setrate':{if(!(it.val>0))return{msgs:[A('That rate didn’t parse — try “set usd 51”.')]};DB.rates[it.cur]=it.val;DB.settings.ratesUpdated=todayStr();return{changed:true,msgs:[A('Done — '+FLAGS[it.cur]+' '+it.cur+' is now '+fmt(it.val)+' EGP. Everything recalculated.')]};}
    case 'addfund':{if(DB.funds.names.includes(it.name))return{msgs:[A('“'+it.name+'” already exists.')]};DB.funds.names.push(it.name);return{changed:true,msgs:[A('Fund added: '+it.name+'. Book a buy like “buy 100 '+it.name.split(' ')[0]+' @ 100”.')]};}

/* ── smart paste ingestion (Excel / Numbers tables) ── */
let PENDING=null;

    expected:['contract rent','contract','expected','agreed','due rent'],mortgage:['mortgage','loan payment','installment','emi'],
    note:['note','notes','for','reason','memo','remark','comment','what'],tenant:['tenant','lessee','occupant','renter']}},
  payments:{tab:'Payments',label:'Payments',noun:'installment',req:['amount'],cols:{

const FIELD_LABELS={type:'Type',fund:'Fund',date:'Date',units:'Units',price:'Price',fee:'Fee',desc:'Description',amount:'Amount',cur:'Currency',cat:'Category',month:'Month',received:'Rent received',expected:'Contract rent',mortgage:'Mortgage',note:'Note',tenant:'Tenant'};
function fieldLabel(f){return FIELD_LABELS[f]||f;}

function parseCSVLine(line){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];
  if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
  else{if(c==='"')q=true;else if(c===','){out.push(cur);cur='';}else cur+=c;}}out.push(cur);return out;}

function parseTable(text){const delim=detectDelim(text);const lines=text.replace(/\r/g,'').split('\n').map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim()!=='');
  return lines.map(l=>{let cells;if(delim==='\t')cells=l.split('\t');else if(delim===',')cells=parseCSVLine(l);else cells=l.trim().split(/\s{2,}/);return cells.map(c=>c.trim());});}
function maxCols(rows){return Math.max.apply(null,rows.map(r=>r.length));}
function isNumericCell(s){const t=String(s).trim();if(!t)return false;return /^[(]?[-+]?[\d.,]+%?[)]?$/.test(t);}

  const r0=rows[0],r1=rows[1];let score=0,n=Math.min(r0.length,r1.length);for(let i=0;i<n;i++){if(/[a-zA-Z]{2,}/.test(String(r0[i]))&&isNumericCell(r1[i]))score++;}return score>=1;}
function pMoney(s){if(typeof s==='number')return s;let str=String(s).trim();if(!str)return 0;const neg=/^\(.*\)$/.test(str)||str.charAt(0)==='-';
  let c=str.replace(/[^\d.]/g,'');const p=c.split('.');if(p.length>2)c=p[0]+'.'+p.slice(1).join('');let v=parseFloat(c);if(!isFinite(v))v=0;return neg?-Math.abs(v):v;}
function normDate(s){s=String(s||'').trim();let m;if(!s)return '';

  if(m=s.match(/^(\d{4})[-\/](\d{1,2})$/))return m[1]+'-'+String(m[2]).padStart(2,'0')+'-01';
  if(m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/)){let d=+m[1],mo=+m[2],y=+m[3];if(y<100)y+=2000;if(mo>12&&d<=12){const t=d;d=mo;mo=t;}return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
  const dt=new Date(s);return isNaN(dt)?'':dt.toISOString().slice(0,10);}
function monthFrom(s){const d=normDate(s);return d?d.slice(0,7):(/^\d{4}-\d{2}$/.test(String(s).trim())?String(s).trim():'');}
function classify(header){const h=header.map(x=>String(x).toLowerCase());const has=k=>h.some(x=>x.includes(k));
  if((has('units')||has('qty')||has('shares'))&&(has('price')||has('nav')))return'funds';
  if(has('tenant')||has('mortgage')||has('rent received')||(has('rent')&&(has('month')||has('mortgage'))))return'rental';
  if(has('installment')||has('due')||has('schedule')||(has('loan')&&has('amount')))return'payments';
  if(has('amount')||has('value')||has('balance')||has('description')||has('holding')||has('market value'))return'assets';
  return null;}
function buildMap(dest,header){const cols=SCHEMAS[dest].cols,used=new Set(),map={},keys=Object.keys(cols);const H=header.map(x=>String(x).toLowerCase().trim());
  keys.forEach(k=>{for(const syn of cols[k]){const i=H.findIndex((h,ix)=>!used.has(ix)&&h===syn);if(i>=0){map[k]=i;used.add(i);break;}}});
  keys.forEach(k=>{if(map[k]!=null)return;for(const syn of cols[k]){const i=H.findIndex((h,ix)=>!used.has(ix)&&h.includes(syn));if(i>=0){map[k]=i;used.add(i);break;}}});
  keys.forEach(k=>{if(map[k]==null)map[k]=-1;});return map;}
function positionalMap(dest,nc){const m={};let o=[];
  if(dest==='funds')o=nc>=5?['fund','date','units','price','fee']:nc===4?['fund','date','units','price']:nc===3?['fund','units','price']:['units','price'];
  else if(dest==='assets')o=nc>=3?['desc','amount','cur']:['desc','amount'];
  else if(dest==='rental')o=nc>=5?['month','received','expected','mortgage','note']:nc===4?['month','received','expected','mortgage']:nc===3?['month','received','mortgage']:['month','received'];
  else if(dest==='payments')o=nc>=3?['date','amount','note']:['date','amount'];
  o.forEach((k,i)=>m[k]=i);Object.keys(SCHEMAS[dest].cols).forEach(k=>{if(m[k]==null)m[k]=-1;});return m;}
function mapDesc(dest,map,header){return Object.keys(map).filter(k=>map[k]!=null&&map[k]>=0)
  .map(k=>{const idx=map[k];const src=header?(header[idx]||('col'+(idx+1))):('col'+(idx+1));return fieldLabel(k)+'←'+src;}).join(', ');}
function val(r,i){return (i!=null&&i>=0&&i<r.length)?r[i]:'';}
function commit(dest,rows,map){let placed=0,skipped=0,firstErr='';const fail=(ri,msg)=>{skipped++;if(!firstErr)firstErr='row '+(ri+1)+' ('+msg+')';};
  rows.forEach((r,ri)=>{
    if(dest==='funds'){let fund=String(val(r,map.fund)).trim();const units=pMoney(val(r,map.units)),price=pMoney(val(r,map.price)),fee=pMoney(val(r,map.fee));
      const type=/sell|sold/.test(String(val(r,map.type)).toLowerCase())?'SELL':'BUY';const date=normDate(val(r,map.date))||todayStr();
      if(!fund&&DB.funds.names.length===1)fund=DB.funds.names[0];if(!fund)return fail(ri,'no fund name');if(!(units>0)||!(price>0))return fail(ri,'units/price unreadable');
      if(!DB.funds.names.includes(fund))DB.funds.names.push(fund);DB.funds.transactions.push(Object.assign(tx(type,fund,date,units,price,fee),{u:todayStr()}));if(!DB.funds.currentPrices[fund])DB.funds.currentPrices[fund]=price;placed++;}
    else if(dest==='assets'){const desc=String(val(r,map.desc)).trim();const amt=pMoney(val(r,map.amount));let cur=String(val(r,map.cur)).toUpperCase().replace(/[^A-Z]/g,'');if(!FLAGS[cur])cur='EGP';let cat=map.cat>=0?fuzzyCat(val(r,map.cat)):null;cat=cat||DB.assets.categories[0];
      if(!desc&&!amt)return fail(ri,'empty');if(!desc)return fail(ri,'no description');const cd=DB.assets.data[cat.id]=DB.assets.data[cat.id]||{};(cd[cur]=cd[cur]||[]).push({desc,amt,u:todayStr()});placed++;}

      let tid=null;if(map.tenant>=0){const q=String(val(r,map.tenant)).toLowerCase().trim();if(q){const t=DB.rental.tenants.find(t=>t.name.toLowerCase().includes(q));tid=t?t.id:null;}}
      if(!tid){if(!DB.rental.tenants.length)DB.rental.tenants.push({id:uid(),name:'Tenant',color:PAL[0],contractStart:todayStr(),contractRent:0,property:'',u:todayStr()});tid=DB.rental.tenants[0].id;}
      DB.rental.records.push({id:uid(),month,tenantId:tid,received,expected,note,mortgage,expenses:[],u:todayStr()});placed++;}
    else if(dest==='payments'){let plan=DB.payments.plans[0];if(!plan){plan={id:uid(),title:'Imported plan',type:'other',color:PAL[3],linked:{kind:null,ref:''},installments:[],u:todayStr()};DB.payments.plans.push(plan);}
      const amt=pMoney(val(r,map.amount));if(!(amt>0))return fail(ri,'no amount');const date=normDate(val(r,map.date))||todayStr();const note=map.note>=0?String(val(r,map.note)):'';

  });

function placeAndReport(dest,rows,map,header){const res=commit(dest,rows,map);const S=SCHEMAS[dest];
  if(!res.placed)return{msgs:[A('I couldn’t read any rows — '+(res.firstErr||'check the columns')+'. Paste again with a header row, or tell me which column is which.')]};
  let txt='✓ Placed '+res.placed+' '+S.noun+(res.placed===1?'':'s')+' in '+S.label;const md=mapDesc(dest,map,header);if(md)txt+=' — read as '+md;
  txt+='.';if(res.skipped)txt+=' Skipped '+res.skipped+' ('+res.firstErr+').';txt+=' Open '+S.tab+' to verify.';
  return{msgs:[A(txt)],changed:true};}
function continueMapping(dest,rows,header,map){const miss=SCHEMAS[dest].req.filter(f=>map[f]==null||map[f]<0);
  if(miss.length&&header){const need=miss[0];PENDING={stage:'columns',dest,rows,header,map,need};
    const opts=header.map((h,i)=>(i+1)+') '+(h||('col'+(i+1)))+(rows[0]&&rows[0][i]!=null&&rows[0][i]!==''?' ['+rows[0][i]+']':'')).join('   ');
    return{msgs:[A('Almost there — which column is the '+fieldLabel(need)+'? Reply with its number:  '+opts)]};}
  PENDING={stage:'confirm',dest,rows,map,header};
  return{msgs:[A('Ready to place '+rows.length+' row'+(rows.length===1?'':'s')+' into '+SCHEMAS[dest].label+' \u2014 read as '+(mapDesc(dest,map,header)||'positional order')+'. Reply \u201cgo\u201d to confirm, or \u201ccancel\u201d.'),previewCard(dest,rows,map)]};}
function routeDataset(d){const rows=PENDING.rows,header=PENDING.header;
  if(header){const map=buildMap(d,header);PENDING=null;return continueMapping(d,rows,header,map);}
  const map=positionalMap(d,maxCols(rows));PENDING={stage:'confirm',dest:d,rows,map,header:null};
  return{msgs:[A('No header detected. I’ll read it as: '+mapDesc(d,map,null)+'. Reply “go” to place '+rows.length+' row'+(rows.length===1?'':'s')+', or “cancel”.')]};}
function destWord(s){if(/fund/.test(s))return'funds';if(/asset/.test(s))return'assets';if(/rent/.test(s))return'rental';if(/pay|loan|install|schedul/.test(s))return'payments';return null;}
function ingest(text){const rows=parseTable(text);if(!rows.length||(rows.length===1&&rows[0].length<2))return{msgs:[A('That didn’t look like a table. Copy cells from Excel or Numbers (they paste as columns), or type a command like “buy 100 Osoul @ 962”.')]};
  const hasHeader=detectHeader(rows);const header=hasHeader?rows[0]:null;const body=hasHeader?rows.slice(1):rows;
  if(!body.length)return{msgs:[A('I only see a header row — paste the data rows too.')]};

  if(!dest){PENDING={stage:'dataset',rows:body,header};const cols=(header||body[0]).map((c,i)=>(i+1)+') '+(c||'?')).join('  ');
    return{msgs:[A('Got '+body.length+' row'+(body.length===1?'':'s')+'. Which dataset is this — funds, assets, rental or payments?  Columns: '+cols)]};}
  const map=buildMap(dest,header);return continueMapping(dest,body,header,map);}

  if(PENDING.stage==='dataset'){const d=destWord(low);return d?routeDataset(d):null;}
  if(PENDING.stage==='confirm'){if(/^(go|yes|y|ok|okay|confirm|place|do it|sure)$/.test(low)){const c=PENDING;PENDING=null;return placeAndReport(c.dest,c.rows,c.map,c.header||null);}return null;}

  items.forEach((it,idx)=>{const a1=a0+it.v/tot*Math.PI*2;const mid=(a0+a1)/2;const off=idx===ovAllocSel?10:0;const ox=Math.cos(mid)*off,oy=Math.sin(mid)*off;
    x.beginPath();x.moveTo(cx+ox,cy+oy);x.arc(cx+ox,cy+oy,R,a0,a1);x.closePath();x.fillStyle=it.color;x.globalAlpha=(ovAllocSel>=0&&idx!==ovAllocSel)?.32:1;x.fill();x.globalAlpha=1;a0=a1;});
  x.globalCompositeOperation='destination-out';x.beginPath();x.arc(cx,cy,inner,0,7);x.fill();x.globalCompositeOperation='source-over';
  x.textAlign='center';
  if(ovAllocSel>=0&&items[ovAllocSel]){const it=items[ovAllocSel];x.fillStyle=it.color;x.font='600 20px '+cvar('--mono');x.fillText(MASK()?'•••':(it.v/tot*100).toFixed(1)+'%',cx,cy-14);x.fillStyle=ink;x.font='600 13px '+cvar('--mono');x.fillText(mval(it.v,fmt)+' EGP',cx,cy+5);x.fillStyle=dim;x.font='500 11px '+cvar('--ui');const nm=it.n.length>16?it.n.slice(0,15)+'…':it.n;x.fillText(nm,cx,cy+21);}
  else{x.fillStyle=ink;x.font='600 18px '+cvar('--mono');x.fillText(mval(tot,shortN),cx,cy);x.fillStyle=dim;x.font='500 10px '+cvar('--ui');x.fillText('EGP total',cx,cy+16);}}
function wireAlloc(){const cv=$('#ovDonut');if(!cv)return;drawAlloc();
  cv.style.cursor='pointer';
  cv.onclick=e=>{const rect=cv.getBoundingClientRect();const px=e.clientX-rect.left,py=e.clientY-rect.top;const w=cv.clientWidth,h=230;const cx=w/2,cy=h/2,R=Math.min(w,h)/2-14,inner=R*0.6;
    const dx=px-cx,dy=py-cy,d=Math.hypot(dx,dy);if(d<inner||d>R+12){ovAllocSel=-1;drawAlloc();return;}
    let ang=Math.atan2(dy,dx);if(ang<-Math.PI/2)ang+=Math.PI*2;const items=allocationVisible();const tot=items.reduce((a,b)=>a+b.v,0)||1;let a0=-Math.PI/2,found=-1;
    for(let i=0;i<items.length;i++){const a1=a0+items[i].v/tot*Math.PI*2;if(ang>=a0&&ang<a1){found=i;break;}a0=a1;}ovAllocSel=(found===ovAllocSel)?-1:found;drawAlloc();};
  const leg=$('#ovLegend');if(leg)leg.onclick=e=>{const s=e.target.closest('[data-alloc]');if(s)toggleAlloc(s.getAttribute('data-alloc'));};}

/* ════════════ currency rates: freshness + update ════════════ */
function workingDaysSince(d){if(!d)return 999;let n=0;const cur=new Date(d+'T00:00:00'),today=new Date(todayStr()+'T00:00:00');
  while(cur<today){cur.setDate(cur.getDate()+1);const wd=cur.getDay();if(wd!==5&&wd!==6)n++;}return n;}  /* Egypt weekend = Fri/Sat */
function ratesStale(){return workingDaysSince(DB.settings.ratesUpdated)>3;}
function ratesStamp(){const d=DB.settings.ratesUpdated;const stale=ratesStale();
  return `<span class="muted" style="font-size:11px">Rates updated: ${d?fmtDate(d):'—'}</span>${stale?' <span class="tag" style="background:rgba(251,191,36,.16);color:var(--amber)">⚠ over 3 working days — update</span>':''}`;}
function openRatesUpdate(){$('#modal').innerHTML=`<h3>Update currency rates</h3><div class="desc">${ratesStale()?'<b style="color:var(--amber)">These rates are over 3 working days old.</b> ':''}Enter today’s rates (EGP per unit), or pull mid-market rates online. They power every conversion in the app.</div>
  <div class="grid2">${['USD','EUR','AED'].map(c=>`<div><label class="fl">${FLAGS[c]} 1 ${cchip(c)} = ? EGP</label><input class="inp num" id="ru_${c}" value="${fmt(DB.rates[c])}"></div>`).join('')}</div>
  <div class="row" style="margin-top:12px;align-items:center"><button class="btn sm" onclick="fetchRates()">🌐 Fetch latest online</button><span class="muted" id="ruMsg" style="font-size:11px"></span></div>
  <div class="mfoot"><button class="btn gho" onclick="closeModal()">Later</button><button class="btn pri" onclick="saveRates()">Save rates</button></div>`;$('#scrim').classList.add('on');}
async function fetchRates(){const m=$('#ruMsg');if(m)m.textContent='Fetching…';
  try{const r=await fetch('https://open.er-api.com/v6/latest/USD');const j=await r.json();const egpUsd=j&&j.rates&&j.rates.EGP;if(!egpUsd)throw 0;
    $('#ru_USD').value=fmt(egpUsd);if(j.rates.EUR)$('#ru_EUR').value=fmt(egpUsd/j.rates.EUR);if(j.rates.AED)$('#ru_AED').value=fmt(egpUsd/j.rates.AED);
    if(m)m.textContent='Pulled official mid-market rates — review and save.';}
  catch(e){if(m)m.textContent='Couldn’t fetch (offline or blocked) — enter them manually.';}}
function saveRates(){let ch=false;['USD','EUR','AED'].forEach(c=>{const v=parseAmt($('#ru_'+c).value);if(v>0&&v!==DB.rates[c]){DB.rates[c]=v;ch=true;}});
  DB.settings.ratesUpdated=todayStr();closeModal();persist();toast(ch?'Rates updated ✓':'Marked rates as checked ✓');}

/* ════════════ planner: clear what-if scenario ════════════ */
async function plResetScenario(){if(!(DB.planner.incomings.length||DB.planner.outgoings.length)){toast('No scenario items to clear');return;}
  if(!await confirmGlass('Reset scenario','Remove all temporary what-if rows? Your real records are untouched.',true))return;snapUndo();

<script>
/* ════════════ UNDO ════════════ */
let UNDO=null;
function snapUndo(what){UNDO={json:JSON.stringify(DB),t:Date.now(),what:what||''};refreshUndo();}
function doUndo(){if(!UNDO){toast('Nothing to undo');return;}DB=migrate(JSON.parse(UNDO.json));UNDO=null;save();applyTheme();applyPrivacy();renderActive();updateBadges();refreshUndo();toast('Restored ✓');}
function toastUndo(msg){const el=$('#toast');el.innerHTML=esc(msg)+' <button class="btn sm" style="margin-left:10px;padding:4px 10px" onclick="doUndo()">Undo</button>';el.className='toast glass show';clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),6000);}

/* ════════════ SMART CHAT LAYER ════════════ */
const PL_IN=['rent','salary','income','bonus','dividend','refund','sale','payout','profit','deposit','cashback'];
const PL_OUT=['expense','expenses','bill','bills','cost','costs','spend','spending','payment','fee','fees','shopping','tuition','maintenance','installment','groceries','travel','fuel','gym','subscription','school'];
function pAmt2(n,suf){let v=parseAmt(n);if(suf){const s=suf.toLowerCase();if(s==='k')v*=1e3;else if(s==='m')v*=1e6;}return v;}
function parseSmartOne(text){const t=text.trim(),low=t.toLowerCase();let m;
  m=low.match(/\b(usd|eur|aed|egp)\b/);
  if(m&&/(balance|balances|total|sum|how much|accounts?|holdings?)/.test(low)&&!/\b(buy|sell|sold|bought|price|rate|set)\b/.test(low))
    return{kind:'curbal',cur:m[1].toUpperCase()};
  m=t.match(/^when\s+(?:was|were)\s+(?:the\s+)?(.+?)\s+(?:purchased|bought|acquired|added)\??$/i)||t.match(/^when\s+did\s+(?:i|we)\s+(?:buy|purchase|acquire|get)\s+(?:the\s+)?(.+?)\??$/i);
  if(m)return{kind:'when',q:m[1].trim()};
  m=t.match(/^(?:how much is|what'?s|whats)\s+(?:the\s+)?(.+?)\s+worth\??$/i)||t.match(/^(?:value|worth)\s+of\s+(?:the\s+)?(.+?)\??$/i);
  if(m)return{kind:'worthof',q:m[1].trim()};
  m=t.match(/^(?:add|put)\s+([\d.,]+)\s*(k|m)?\s*(?:egp)?\s+for\s+(.+?)\s*$/i);
  if(m)return{kind:'planadd',amt:pAmt2(m[1],m[2]),label:m[3].trim()};
  if(/^(brief|daily brief|digest|morning brief|report)$/.test(low))return{kind:'brief'};
  return parseUnified(t);
}
function splitIntents(text){if(/\t|\n/.test(text))return null;
  const parts=text.split(/\s*(?:;|,?\s+and\s+|,\s+)\s*/i).map(s=>s.trim()).filter(Boolean);
  if(parts.length<2||parts.length>5)return null;const items=[];
  for(let i=0;i<parts.length;i++){let it=parseSmartOne(parts[i]);
    if(it.kind==='unknown'&&i>0)it=parseSmartOne('add '+parts[i]);
    if(it.kind==='unknown')return null;items.push(it);}
  return items;}
function planKindOf(label){const l=label.toLowerCase();
  if(PL_IN.some(k=>l.includes(k)))return'in';if(PL_OUT.some(k=>l.includes(k)))return'out';return null;}
function commitPlanAdd(it,k){DB.planner[k==='in'?'incomings':'outgoings'].push({id:uid(),label:it.label,amount:it.amt,date:todayStr(),u:todayStr()});
  return{changed:true,msgs:[A('Added to Planner what-if: '+it.label+' — '+fmt(it.amt)+' EGP ('+(k==='in'?'money in':'money out')+'). “Reset scenario” clears temp rows anytime.')]};}
function execOne(it){
  switch(it.kind){
    case 'curbal':{const cur=it.cur,list=[];let tot=0;
      DB.assets.categories.forEach(c=>{const cd=DB.assets.data[c.id]||{};(cd[cur]||[]).forEach(x=>{const v=Number(x.amt)||0;list.push({k:c.icon+' '+x.desc,v});tot+=v;});});
      if(cur==='EGP'){const fv=fundsValueEGP();if(fv>0){list.push({k:'📈 Mutual funds',v:fv});tot+=fv;}}
      if(!list.length)return{msgs:[A('No '+cur+' holdings found.')]};
      list.sort((a,b)=>b.v-a.v);
      const head=cur+' across '+list.length+' item'+(list.length===1?'':'s')+': '+fmt(tot)+' '+cur+(cur!=='EGP'?' ≈ '+fmt(tot*rate(cur))+' EGP':'')+'.';
      return{msgs:[A(head),{role:'agent',kind:'card',card:'list',t:cur+' holdings',rows:list.slice(0,8).map(x=>({k:x.k,v:fmt(x.v),c:cur}))}]};}
    case 'when':{const f=fuzzyFund(DB.funds.names,it.q);
      if(f.match){const buys=DB.funds.transactions.filter(x=>x.fund===f.match&&x.type==='BUY').sort((a,b)=>new Date(a.date)-new Date(b.date));
        if(!buys.length)return{msgs:[A('No buys recorded for '+f.match+'.')]};
        let s=f.match+' was first purchased on '+fmtDate(buys[0].date)+' ('+fmt(buys[0].units)+' units @ '+fmt(buys[0].price)+')';
        if(buys.length>1)s+=' — '+buys.length+' buys total, latest '+fmtDate(buys[buys.length-1].date);
        return{msgs:[A(s+'.')]};}
      if(f.options.length)return{msgs:[A('Which fund — '+f.options.join(' / ')+'?')]};
      const hits=findAssetItems(it.q);
      if(hits.length)return{msgs:[A('“'+hits[0].it.desc+'” is tracked at current value — assets don’t store purchase dates (fund buys do). Tip: keep the date in its description, e.g. “'+hits[0].it.desc+' (2025-06)”.')]};
      return{msgs:[A('Nothing matching “'+it.q+'” in funds or assets.')]};}
    case 'worthof':{const hits=findAssetItems(it.q);
      if(hits.length){let tot=0;const rows=hits.slice(0,6).map(h=>{tot+=(Number(h.it.amt)||0)*rate(h.cur);return{k:h.cat.icon+' '+h.it.desc,v:fmt(h.it.amt)+' '+h.cur};});
        if(hits.length===1){const h0=hits[0];return{msgs:[A('“'+h0.it.desc+'” is '+fmt(h0.it.amt)+' '+h0.cur+(h0.cur!=='EGP'?' ≈ '+fmt((Number(h0.it.amt)||0)*rate(h0.cur))+' EGP':'')+'.')]};}
        return{msgs:[A(hits.length+' matches totalling ≈ '+fmt(tot)+' EGP:'),{role:'agent',kind:'card',card:'list',t:'Matches',rows}]};}
      const f=fuzzyFund(DB.funds.names,it.q);
      if(f.match){const h=holdingsArray().find(x=>x.fund===f.match);return{msgs:[A(f.match+' position: '+fmt(h.currentValue)+' EGP ('+fmt(h.units)+' units @ '+fmt(h.price)+', '+pct(h.returnPct)+').')]};}
      if(f.options.length)return{msgs:[A('Which one — '+f.options.join(' / ')+'?')]};
      return{msgs:[A('Couldn’t find “'+it.q+'”.')]};}
    case 'planadd':{if(!(it.amt>0))return{msgs:[A('Couldn’t read that amount.')]};
      const k=planKindOf(it.label);
      if(!k){PENDING={stage:'plankind',item:it};return{msgs:[A('Is “'+it.label+'” money in or money out?')]};}
      return commitPlanAdd(it,k);}
    case 'brief':return execBrief();
    default:return execUnified(it);
  }
}
function execSmart(text){const multi=splitIntents(text);
  if(multi){let msgs=[],changed=false;
    for(let i=0;i<multi.length;i++){const r=execOne(multi[i]);msgs=msgs.concat(r.msgs);changed=changed||!!r.changed;
      if(PENDING&&PENDING.stage==='plankind'){PENDING.rest=multi.slice(i+1);break;}}
    return{msgs,changed};}
  return execOne(parseSmartOne(text));}
function resolveSmart(text){const low=text.trim().toLowerCase();
  if(PENDING&&PENDING.stage==='plankind'){
    let k=null;if(/^(in|income|incoming|money in|credit)$/.test(low))k='in';else if(/^(out|expense|outgoing|money out|debit|spend)$/.test(low))k='out';
    if(!k){if(/^(cancel|no|stop|nvm)$/.test(low)){PENDING=null;return{msgs:[A('Cancelled — nothing added.')]};}return null;}
    const item=PENDING.item,rest=PENDING.rest||[];PENDING=null;const res=commitPlanAdd(item,k);
    for(let i=0;i<rest.length;i++){const r=execOne(rest[i]);res.msgs=res.msgs.concat(r.msgs);res.changed=res.changed||!!r.changed;
      if(PENDING&&PENDING.stage==='plankind'){PENDING.rest=rest.slice(i+1);break;}}
    return res;}
  return resolvePending(text);}
function previewCard(dest,rows,map){const fields=Object.keys(SCHEMAS[dest].cols).filter(k=>map[k]!=null&&map[k]>=0);
  const cols=fields.map(fieldLabel);const body=rows.slice(0,3).map(r=>fields.map(fl=>String(val(r,map[fl])===''?'—':val(r,map[fl]))));
  return{role:'agent',kind:'card',card:'preview',cols,rows:body,more:Math.max(0,rows.length-3)};}
</script>

<script>
/* ════════════ ADVISOR METRICS ════════════ */
function totalCommitments(){return allInstallments().filter(i=>!i.paid).reduce((s,i)=>s+(Number(i.amount)||0),0);}
function deltaSince(days){const s=DB.snapshots;if(!s||!s.length)return null;
  const cutoff=new Date(Date.now()-days*86400000).toISOString().slice(0,10);
  let ref=null;for(const x of s){if(x.date<=cutoff)ref=x;else break;}
  if(!ref)ref=s[0];if(ref.date===todayStr())return null;return netWorth().egp-ref.egp;}

/* ════════════ LIQUIDITY TARGET ════════════ */
function monthsTo(dateStr){const now=new Date();now.setDate(1);const g=new Date(dateStr+'T00:00:00');
  return Math.max(1,(g.getFullYear()-now.getFullYear())*12+(g.getMonth()-now.getMonth()));}
function goalStatus(){const g=DB.planner.goal;if(!g||!(g.amount>0)||!g.date)return null;
  const m=monthsTo(g.date);const fl=projectFlows(Math.min(m+1,61));const cash=fl[Math.min(m,fl.length-1)].bal;
  const liquid=cash+fundsValueEGP();const gap=g.amount-liquid;const pctF=Math.max(0,liquid/g.amount*100);
  return{m,cash,liquid,gap,pctF,onTrack:gap<=0,
    text:'Target “'+g.label+'”: projected liquid '+shortN(liquid)+' vs '+shortN(g.amount)+' by '+fmtDate(g.date)+' — '+(gap<=0?'on track ✓':pctF.toFixed(0)+'% funded, short '+shortN(gap)+' (needs +'+shortN(gap/m)+'/mo)')+'.'};}
function goalPanel(){const g=DB.planner.goal||{label:'',amount:0,date:''};const st=goalStatus();let body='';
  if(st){const p=Math.min(100,st.pctF);
    body=`<div class="row" style="align-items:center;margin:10px 0 2px"><div style="flex:1"><div class="bar-track"><div class="bar-fill" style="width:${p}%;background:${st.onTrack?'var(--emerald)':'var(--amber)'}"></div></div></div><span class="muted num" style="font-size:12px">${st.pctF.toFixed(0)}% of ${shortN(g.amount)}</span></div>
    <div class="kpi-mini" style="margin-top:9px"><div class="m">Projected liquid @ date<b class="num ${st.onTrack?'pos':''}">${shortN(st.liquid)}</b></div><div class="m">Gap<b class="num ${st.gap<=0?'pos':'neg'}">${st.gap<=0?'covered ✓':shortN(st.gap)}</b></div><div class="m">Needed / mo<b class="num">${st.gap>0?shortN(st.gap/st.m):'—'}</b></div><div class="m">Months left<b class="num">${st.m}</b></div></div>
    <div class="muted" style="font-size:10.5px;margin-top:8px">Projected liquid = cash-flow projection at that month + current funds value. Scheduled payments and what-if rows are already inside.</div>`;}
  else body='<div class="muted" style="font-size:11.5px;margin-top:8px">Set a target amount and date — projected liquidity (cash flow + funds) gets tracked against it.</div>';
  return `<div class="panel glass" id="panel_goal" style="border-left:3px solid var(--teal)"><div class="ph"><span class="swatch" style="background:var(--teal)"></span><h3>Liquidity target</h3>${st?`<span class="tag" style="color:${st.onTrack?'var(--pos)':'var(--amber)'}">${st.onTrack?'On track':'Attention'}</span>`:''}<span class="sp"></span></div>
    <div class="row"><div class="field" style="flex:1.4"><label>Label</label><input class="inp" value="${esc(g.label||'')}" onchange="plGoal('label',this.value)"></div>
    <div class="field" style="flex:1"><label>Target (EGP)</label><input class="inp num" value="${g.amount?fmt(g.amount):''}" placeholder="e.g. 17,000,000" onchange="plGoal('amount',this.value)"></div>
    <div class="field"><label>By date</label><input class="inp num" type="date" value="${g.date||''}" onchange="plGoal('date',this.value)"></div></div>${body}</div>`;}
function plGoal(f,v){DB.planner.goal=DB.planner.goal||{label:'',amount:0,date:''};DB.planner.goal[f]=f==='amount'?parseAmt(v):v;DB.planner.goal.u=todayStr();persist();}

/* ════════════ DAILY BRIEF ════════════ */
function execBrief(){const n=netWorth();const d30=deltaSince(30);const u=upcomingPayments(14);const uAmt=u.reduce((s,i)=>s+i.amount,0);
  const rows=rentalRows();const last=rows[rows.length-1];const g=goalStatus();const L=[];
  L.push('Net worth '+fmt(n.egp)+' EGP'+(d30==null?'':' ('+signed(d30)+' over 30d)')+'.');
  L.push(u.length?u.length+' payment'+(u.length===1?'':'s')+' due within 14 days — '+fmt(uAmt)+' EGP'+(u.some(x=>x.over)?' (some overdue ⚠)':'')+'.':'No payments due in the next 14 days.');
  if(last)L.push('Rental '+last.month+': net '+signed(last.net)+' EGP'+(last.variance?', variance '+signed(last.variance)+(last.note?'':' — needs a note'):'')+'.');
  if(g)L.push(g.text);
  if(ratesStale())L.push('FX rates are stale — tap ↻ Update.');
  return{msgs:[A('Your brief ☕')].concat(L.map(A))};}

/* ════════════ CHART TOOLTIP ════════════ */
function lineHover(cv,e){const P=cv._pts;if(!P||!P.length||!cv._args)return;
  const r=cv.getBoundingClientRect();const mx=e.clientX-r.left;
  let best=null,bd=30;P.forEach(p=>{const d=Math.abs(p.sx-mx);if(d<bd){bd=d;best=p;}});
  Charts.line(cv,cv._args[0],cv._args[1]);if(!best)return;
  const x=cv.getContext('2d');const g=cv._geom||{};
  x.strokeStyle=cvar('--ink-faint');x.globalAlpha=.55;x.setLineDash([3,3]);x.beginPath();
  x.moveTo(best.sx,g.padT||12);x.lineTo(best.sx,(g.h||230)-(g.padB||24));x.stroke();x.setLineDash([]);x.globalAlpha=1;
  x.beginPath();x.arc(best.sx,best.sy,4.5,0,7);x.fillStyle=best.color;x.fill();x.strokeStyle=cvar('--bg-0');x.lineWidth=2;x.stroke();
  const lab=(best.label?best.label+' · ':'')+fmtDate(best.x),valTxt=mval(best.y,fmt);
  x.font='600 11.5px '+cvar('--mono');const w1=x.measureText(valTxt).width;
  x.font='500 9.5px '+cvar('--ui');const w2=x.measureText(lab).width;
  const bw=Math.max(w1,w2)+18,bh=36;let bx=best.sx+10;if(bx+bw>(g.w||cv.clientWidth)-4)bx=best.sx-bw-10;const by=Math.max(4,best.sy-bh-8);
  x.fillStyle=cvar('--glass-2')||'rgba(20,30,28,.92)';x.strokeStyle=cvar('--line');x.beginPath();
  if(x.roundRect)x.roundRect(bx,by,bw,bh,8);else x.rect(bx,by,bw,bh);x.fill();x.stroke();
  x.textAlign='left';x.fillStyle=cvar('--ink');x.font='600 11.5px '+cvar('--mono');x.fillText(valTxt,bx+9,by+15);
  x.fillStyle=cvar('--ink-faint');x.font='500 9.5px '+cvar('--ui');x.fillText(lab,bx+9,by+28);}

/* ════════════ CHROME: theme icons + shortcuts ════════════ */
const ICO_MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13A8 8 0 1 1 11 4a6.5 6.5 0 0 0 9 9z"/></svg>';
const ICO_SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/></svg>';
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();gsOpen();}}); /* A2: ⌘K → global search (reverses the v6 chat binding, deliberately — chat keeps its chip + Overview placement) */

<script>
/* investable NW = total − personal items − any item described as “primary …” */
function primaryResidenceEgp(){let v=0;DB.assets.categories.forEach(c=>{const cd=DB.assets.data[c.id]||{};
  Object.keys(cd).forEach(cur=>{(cd[cur]||[]).forEach(it=>{if(/\bprimary\b/i.test(it.desc))v+=(Number(it.amt)||0)*rate(cur);});});});return v;}
function investableNW(){return netWorth().egp-((assetsTotals().byCat['personal'])||0)-primaryResidenceEgp();}
</script>

<script>
/* ════════════ A2 LAYER — grouped rail · Attention Center · global search · mobile chrome ════════════ */

/* ── rail groups (state persisted in settings.navOpen) ── */
function applyNavState(){const st=DB.settings.navOpen||{};
  $$('.navgrp').forEach(g=>g.classList.toggle('closed',st[g.dataset.grp]===false));}
function navGrp(k){DB.settings.navOpen=DB.settings.navOpen||{};
  DB.settings.navOpen[k]=DB.settings.navOpen[k]===false;save();applyNavState();}
function renderNavSubs(){
  const A=$('#subs_assets');if(A)A.innerHTML=TIERS.map(([k,ic,nm])=>{const cs=DB.assets.categories.filter(c=>tierOf(c)===k);if(!cs.length)return '';
    return `<div class="subhead">${ic} ${nm}</div>`+cs.map(c=>`<button class="subitem" onclick="navSub('assets','panel_cat_${c.id}')"><i class="sdot" style="background:${c.color||'var(--line)'}"></i>${c.icon} ${esc(c.name)}</button>`).join('');}).join('');
  const F=$('#subs_funds');if(F)F.innerHTML=DB.funds.names.map(f=>
    `<button class="subitem" data-f="${esc(f)}" onclick="navSubFund(this.dataset.f)"><i class="sdot" style="background:${curColor('EGP')}"></i>📈 ${esc(f)}</button>`).join('');
  const P=$('#subs_payments');if(P)P.innerHTML=DB.payments.plans.map(p=>
    `<button class="subitem" onclick="navSub('payments','panel_plan_${p.id}')"><i class="sdot" style="background:${p.color}"></i>${esc(p.title)}</button>`).join('');}
function navSub(tab,anchor){switchTab(tab);flashTarget(anchor);}
function navSubFund(name){fnChartFund=name;switchTab('funds');flashTarget('panel_funds_prices');}

/* ── jump + flash (2× accent pulse, then clean) ── */
function flashTarget(id){if(!id)return;showChrome(1800);setTimeout(()=>{const el=document.getElementById(id);if(!el)return;
  if(el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'start'});
  el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
  setTimeout(()=>el.classList.remove('flash'),1700);},80);}
function railFlash(tab){if(!tab)return;$$('.navbtn').forEach(b=>{if(b.dataset.tab===tab){
  b.classList.add('railhl');setTimeout(()=>b.classList.remove('railhl'),1600);}});}

/* ── Attention Center ── */
const ATTN_SOURCES=[]; /* B/C sessions: ATTN_SOURCES.push(fn) where fn() → items[]. Never edit attentionItems for new sources. */
let ATTN_LAST=[];
function attentionItems(fl){const items=[];fl=fl||collectFlags();
  const over=allInstallments().filter(i=>!i.paid&&i.date<todayStr());
  if(over.length)items.push({icon:'📅',level:'red',
    title:over.length+' overdue installment'+(over.length===1?'':'s')+' — '+shortN(over.reduce((s,i)=>s+(Number(i.amount)||0),0))+' EGP',
    detail:'Mark them paid or move the dates — the planner is assuming cash you already owe.',
    act:{label:'Open Payments',fn:()=>switchTab('payments')}});
  if(ratesStale())items.push({icon:'💱',level:'amber',
    title:'FX rates are stale (last updated '+(DB.settings.ratesUpdated||'never')+')',
    detail:'Every EGP conversion in the app uses these rates — refresh to keep totals honest.',
    act:{label:'Update rates',fn:()=>openRatesUpdate()}});
  if(DB.rental.tenants.length&&!DB.rental.records.some(r=>r.month===monthStr()))
    items.push({icon:'🏠',level:'amber',title:'Rent for '+monthStr()+' isn\u2019t logged yet',
      detail:'One tap pre-fills last month\u2019s tenant, contract rent and mortgage \u2014 adjust only what changed.',
      act:{label:'Log month',fn:()=>{switchTab('rental');openRentWizard();}}});
  Object.keys(fl.per||{}).forEach(tab=>{const n=fl.per[tab];if(!n)return;const r=(fl.perRed||{})[tab]||0;
    const why=(fl.perWhy||{})[tab]||{},ex=(fl.perEx||{})[tab]||[];
    const reasons=Object.keys(why).sort((a,b)=>why[b]-why[a]).map(k=>why[k]+' '+k).join(' · ');
    items.push({icon:'⚑',level:r?'red':'amber',
      title:n+' data flag'+(n===1?'':'s')+' in '+(TITLES[tab]?TITLES[tab][0]:tab)+(r?' ('+r+' red)':''),
      detail:(reasons?reasons:'flagged')+(ex.length?' — e.g. '+ex.join(', '):'')+'. Editing a record stamps a fresh update date.',
      act:{label:'Review',fn:()=>switchTab(tab)}});});
  ATTN_SOURCES.forEach(fn=>{try{const ex=fn();if(Array.isArray(ex))items.push(...ex);}catch(e){}});
  return items.sort((a,b)=>(a.level==='red'?0:1)-(b.level==='red'?0:1));}
function attnAct(i){const it=ATTN_LAST[i];if(it&&it.act&&typeof it.act.fn==='function')it.act.fn();}
function renderAttention(){const items=attentionItems();ATTN_LAST=items;
  const red=items.filter(i=>i.level==='red').length,amb=items.length-red;
  $('#atBody').innerHTML=
    secHead('Attention','Everything that needs you \u2014 worst first','')+
    `<div class="cards">`+
    statCard({k:'Needs you',v:String(items.length),sub:items.length?'sorted worst-first below':'nothing at all',hero:true,icon:'⚑'})+
    statCard({k:'Red',v:String(red),sub:red?'act now':'none',scls:red?'neg':'pos',icon:'🔴'})+
    statCard({k:'Amber',v:String(amb),sub:amb?'act this week':'none',scls:amb?'':'pos',icon:'🟡'})+
    `</div>`+
    (items.length?items.map((it,i)=>`<div class="panel glass attn ${it.level}"><div class="ph"><span style="font-size:15px">${it.icon}</span><h3>${esc(it.title)}</h3><span class="sp"></span><button class="btn sm ${it.level==='red'?'pri':'gho'}" onclick="attnAct(${i})">${esc(it.act.label)}</button></div><div class="muted" style="font-size:11.5px">${esc(it.detail)}</div></div>`).join('')
    :`<div class="panel glass"><div class="empty"><span class="big">✅</span>All clear \u2014 nothing needs you.</div></div>`);}

/* ── global indexed search ── */
let GS_RES=[],GS_SEL=-1;
function buildSearchIndex(){const ix=[];const add=o=>ix.push(o);
  const TICON={overview:'◎',assets:'💼',funds:'📈',rental:'🏠',payments:'📅',planner:'🧭',attention:'⚑'};
  Object.keys(TITLES).forEach(t=>add({label:TITLES[t][0],sub:TITLES[t][1],icon:TICON[t]||'•',tab:t,anchorId:null,kw:'tab '+t,w:0}));
  DB.assets.categories.forEach(c=>{add({label:c.name,sub:'Asset category',icon:c.icon,color:c.color,tab:'assets',anchorId:'panel_cat_'+c.id,kw:'category',w:1});
    const cd=DB.assets.data[c.id]||{};Object.keys(cd).forEach(cur=>(cd[cur]||[]).forEach(it=>
      add({label:it.desc,sub:c.name+' \u00b7 '+mval(Number(it.amt)||0)+' '+cur,icon:c.icon,color:curColor(cur),tab:'assets',anchorId:'panel_cat_'+c.id,
        kw:[c.name,cur,it.tp||'',(it.ts||[]).join(' ')].join(' '),w:2})));});
  DB.funds.names.forEach(f=>add({label:f,sub:'Fund \u00b7 opens its price chart',icon:'📈',tab:'funds',anchorId:'panel_funds_prices',fund:f,kw:'fund',w:1}));
  DB.funds.transactions.slice(-80).forEach(t=>add({label:t.type+' '+t.fund,sub:t.date+' \u00b7 '+mval(Number(t.units)||0)+' u @ '+mval(Number(t.price)||0),icon:'🧾',tab:'funds',anchorId:'panel_funds_tx',kw:t.fund+' '+t.date+' transaction',w:3}));
  DB.rental.tenants.forEach(t=>add({label:t.name,sub:'Tenant \u00b7 '+(t.property||'\u2014'),icon:'🏠',color:t.color,tab:'rental',anchorId:'panel_rn_tenants',kw:'tenant '+(t.property||''),w:1}));
  DB.payments.plans.forEach(p=>{add({label:p.title,sub:'Payment plan',icon:'📅',color:p.color,tab:'payments',anchorId:'panel_plan_'+p.id,kw:'plan',w:1});
    p.installments.forEach(i=>{if(i.note)add({label:i.note,sub:p.title+' \u00b7 '+i.date+' \u00b7 '+mval(Number(i.amount)||0),icon:'📅',color:p.color,tab:'payments',anchorId:'panel_plan_'+p.id,kw:'installment '+p.title,w:3});});});
  DB.planner.incomings.concat(DB.planner.outgoings).forEach(x=>add({label:x.label,sub:'What-if row \u00b7 '+mval(Number(x.amount)||0)+' EGP',icon:'🧭',tab:'planner',anchorId:'panel_whatif',kw:'planner scenario what-if',w:2}));
  const g=DB.planner.goal;if(g&&g.label)add({label:g.label,sub:'Liquidity target \u00b7 '+mval(Number(g.amount)||0)+' EGP',icon:'🎯',tab:'planner',anchorId:'panel_goal',kw:'goal target liquidity',w:1});
  add({label:'Update rates',sub:'Action',icon:'💱',tab:null,action:()=>openRatesUpdate(),kw:'settings fx currency rates',w:1});
  add({label:'Backup',sub:'Action \u00b7 download JSON',icon:'💾',tab:null,action:()=>downloadBackup(),kw:'settings export save',w:1});
  add({label:'Sync',sub:'Action \u00b7 encrypted cloud',icon:'☁️',tab:null,action:()=>openSync(),kw:'settings supabase cloud',w:1});
  add({label:'Pair device',sub:'Action \u00b7 connect your phone',icon:'📱',tab:null,action:()=>openPair(),kw:'settings qr pairing sync phone',w:1});
  add({label:'Privacy',sub:'Action \u00b7 mask numbers',icon:'👁',tab:null,action:()=>togglePrivacy(),kw:'settings hide mask numbers',w:1});
  add({label:'Settings',sub:'Action',icon:'⚙️',tab:null,action:()=>openSettings(),kw:'name rates backup restore',w:1});
  return ix;}
function gsOpen(){const w=$('#gsWrap'),i=$('#gsInput');if(w)w.classList.add('open');if(i){i.focus();if(i.select)try{i.select();}catch(e){}if(i.value)gsQuery();}}
function gsClose(){const w=$('#gsWrap'),d=$('#gsDrop');GS_RES=[];GS_SEL=-1;
  if(d){d.classList.remove('on');d.innerHTML='';}if(w)w.classList.remove('open');}
function gsQuery(){const inp=$('#gsInput');const q=((inp&&inp.value)||'').trim().toLowerCase();const d=$('#gsDrop');
  if(!q){GS_RES=[];GS_SEL=-1;if(d){d.classList.remove('on');d.innerHTML='';}return;}
  const score=e=>{const l=e.label.toLowerCase(),k=((e.kw||'')+' '+(e.sub||'')).toLowerCase();
    if(l.startsWith(q))return 0;if(l.includes(q))return 1;if(k.includes(q))return 2;return -1;};
  const hits=[];buildSearchIndex().forEach(e=>{const s=score(e);if(s>=0)hits.push({e,s});});
  hits.sort((a,b)=>(a.s-b.s)||((a.e.w??2)-(b.e.w??2))); /* ties: named entities (funds/plans/tenants) outrank raw rows */
  const per={},out=[];for(const h of hits){const g=h.e.tab||'actions';per[g]=(per[g]||0)+1;
    if(per[g]<=3)out.push(h.e);if(out.length>=8)break;}
  GS_RES=out;GS_SEL=out.length?0:-1;gsRenderDrop();}
function gsRenderDrop(){const d=$('#gsDrop');if(!d)return;
  if(!GS_RES.length){d.innerHTML='<div class="gsempty">No matches \u2014 try a fund, item, tenant or plan name.</div>';d.classList.add('on');return;}
  let g='',html='';GS_RES.forEach((e,i)=>{const grp=e.tab?(TITLES[e.tab]?TITLES[e.tab][0]:e.tab):'Actions';
    if(grp!==g){g=grp;html+=`<div class="gsg">${esc(grp)}</div>`;}
    html+=`<div class="gsrow${i===GS_SEL?' sel':''}" onmousedown="gsPick(${i})"><span class="gsic">${e.icon||'•'}</span>${e.color?`<i class="sdot" style="background:${e.color}"></i>`:''}<span class="gsl">${esc(e.label)}</span><span class="gss">${esc(e.sub||'')}</span></div>`;});
  d.innerHTML=html;d.classList.add('on');}
function gsPick(i){const e=GS_RES[i];gsClose();showChrome(1800);const inp=$('#gsInput');if(inp)inp.blur();if(!e)return;
  if(e.action){e.action();return;}
  if(e.fund)fnChartFund=e.fund;
  if(e.tab)switchTab(e.tab);
  if(e.anchorId)flashTarget(e.anchorId);
  railFlash(e.tab);}
function initSearch(){const inp=$('#gsInput');if(!inp)return;
  inp.addEventListener('input',gsQuery);
  inp.addEventListener('focus',()=>{const w=$('#gsWrap');if(w)w.classList.add('open');
    if(inp.select)try{inp.select();}catch(e){}   /* tap once, type straight over whatever was there */
    if(inp.value)gsQuery();});
  inp.addEventListener('blur',()=>setTimeout(gsClose,180));
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();if(GS_RES.length){GS_SEL=(GS_SEL+1)%GS_RES.length;gsRenderDrop();}}
    else if(e.key==='ArrowUp'){e.preventDefault();if(GS_RES.length){GS_SEL=(GS_SEL-1+GS_RES.length)%GS_RES.length;gsRenderDrop();}}
    else if(e.key==='Enter'){e.preventDefault();if(GS_SEL>=0)gsPick(GS_SEL);}
    else if(e.key==='Escape'){gsClose();inp.blur();}});}

/* ── mobile auto-hiding chrome: CSS transform only, NO re-render on scroll (standing lint) ── */
function initAutoHide(){const sc=document.querySelector('.scroll');if(!sc)return;let last=0;
  sc.addEventListener('scroll',()=>{if(Date.now()<CHROME_HOLD)return;const y=sc.scrollTop||0;
    if(y>last+24&&y>60){document.body.classList.add('chromehide');last=y;}
    else if(y<last-2){document.body.classList.remove('chromehide');last=y;}
    else if(y>last)last=y;},{passive:true});}
</script>

<script>
/* ════════════ B1 LAYER — entry flows: rent wizard · recurring costs & income · installment generator · sandbox · category modals ════════════ */

/* ── recurring cadence: one rule used by rental costs AND planner income ── */
function monthNum(key){return Number(String(key).slice(5,7))||0;}
function recurDue(t,key){
  if(!t||t.active===false)return false;
  const anchor=t.anchor||(t.start?monthNum(t.start):1);
  if(t.start&&key<String(t.start).slice(0,7))return false;
  if(t.end&&key>String(t.end).slice(0,7))return false;
  const m=monthNum(key);if(!m)return false;
  if(t.freq==='monthly')return true;
  if(t.freq==='quarterly')return ((m-anchor)%3+3)%3===0;
  if(t.freq==='annual')return m===anchor;
  return false;}
function perMonth(t){const a=Number(t.amount)||0;return t.freq==='monthly'?a:t.freq==='quarterly'?a/3:a/12;}
const FREQ_LABEL={monthly:'every month',quarterly:'every 3 months',annual:'once a year'};

/* ── rental recurring costs ── */
function rentalCostForMonth(key){return (DB.rental.recurring||[]).filter(t=>recurDue(t,key)).reduce((s,t)=>s+(Number(t.amount)||0),0);}
function suggestedExpenses(key){return (DB.rental.recurring||[]).filter(t=>recurDue(t,key)).map(t=>({id:t.id,label:t.label,amount:Number(t.amount)||0}));}
function recurringPanel(){
  const list=DB.rental.recurring||[];
  const rows=list.length?list.map(t=>`<tr><td class="l">${esc(t.label)}${t.active===false?' <span class="tag">paused</span>':''}<div class="udate">${t.u||'—'}</div></td>
    <td class="num">${fmt(t.amount)}</td><td class="muted" style="font-size:11px">${FREQ_LABEL[t.freq]||t.freq}</td>
    <td><button class="x" onclick="openRecurring('${t.id}')">✏️</button></td><td><button class="x" onclick="delRecurring('${t.id}')">✕</button></td></tr>`).join('')
    :'<tr><td colspan="5" class="muted" style="text-align:center;padding:12px">No recurring costs yet — add taxes, management fees, maintenance.</td></tr>';
  return `<div class="panel glass" id="panel_rn_recurring"><div class="ph"><h3>Recurring costs</h3><span class="sp"></span><button class="btn sm" onclick="openRecurring()">＋ Recurring cost</button></div>
    <div class="muted" style="font-size:11.5px;margin-bottom:9px">Remembered line items. Each new month offers them pre-filled — you confirm or adjust, and they reduce that month's net P/L.</div>
    <table class="tbl"><thead><tr><th class="l">Cost</th><th>Amount (EGP)</th><th>How often</th><th></th><th></th></tr></thead><tbody>${rows}</tbody></table>
    <div class="muted" style="font-size:11px;margin-top:8px">Estimated ${fmt((DB.rental.recurring||[]).filter(t=>t.active!==false).reduce((s,t)=>s+perMonth(t),0))} EGP / month — the planner subtracts this from future months.</div></div>`;}
function openRecurring(id){
  const t=(DB.rental.recurring||[]).find(x=>x.id===id)||{id:'rec_'+uid(),label:'',amount:0,freq:'monthly',anchor:Number(todayStr().slice(5,7)),active:true};
  const isNew=!(DB.rental.recurring||[]).some(x=>x.id===t.id);
  $('#modal').innerHTML=`<h3>${isNew?'New recurring cost':'Edit recurring cost'}</h3>
    <div class="desc">Property taxes, management fees, maintenance retainers — anything that repeats.</div>
    <label class="fl">What is it</label><input class="inp" id="rc_l" value="${esc(t.label)}" placeholder="e.g. Building management fee">
    <div class="grid2"><div><label class="fl">Amount (EGP)</label><input class="inp num" id="rc_a" value="${fmt(t.amount)}"></div>
    <div><label class="fl">How often</label><select class="inp" id="rc_f">${['monthly','quarterly','annual'].map(f=>`<option value="${f}" ${t.freq===f?'selected':''}>${FREQ_LABEL[f]}</option>`).join('')}</select></div></div>
    <div class="grid2"><div><label class="fl">Anchor month (for quarterly / annual)</label><input class="inp num" id="rc_m" value="${t.anchor||1}"></div>
    <div><label class="fl">Status</label><select class="inp" id="rc_s"><option value="1" ${t.active!==false?'selected':''}>Active</option><option value="0" ${t.active===false?'selected':''}>Paused</option></select></div></div>
    <div class="mfoot"><button class="btn gho" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveRecurring('${t.id}')">Save</button></div>`;
  $('#scrim').classList.add('on');}
function saveRecurring(id){
  const label=$('#rc_l').value.trim();if(!label){toast('Give it a name',true);return;}
  const obj={id,label,amount:parseAmt($('#rc_a').value),freq:$('#rc_f').value,
    anchor:Math.min(12,Math.max(1,Math.round(parseAmt($('#rc_m').value)||1))),active:$('#rc_s').value==='1',u:todayStr()};
  DB.rental.recurring=DB.rental.recurring||[];
  const i=DB.rental.recurring.findIndex(x=>x.id===id);
  if(i>=0)DB.rental.recurring[i]=obj;else DB.rental.recurring.push(obj);
  closeModal();persist();toast('Saved ✓');}
async function delRecurring(id){
  const t=(DB.rental.recurring||[]).find(x=>x.id===id);if(!t)return;
  if(!await confirmGlass('Remove recurring cost','“'+t.label+'” stops being offered on new months. Months you already logged keep their costs.',true))return;
  snapUndo();DB.rental.recurring=DB.rental.recurring.filter(x=>x.id!==id);persist();toastUndo('Removed');}

/* ── rent wizard: first week of the month, snoozable, edits existing months too ── */
function rentWizardDue(){
  if(!DB.rental.tenants.length)return false;
  const key=monthStr(),day=Number(todayStr().slice(8,10));
  if(day>7)return false;
  if((DB.settings.rentWizard||{}).snoozedMonth===key)return false;
  return !DB.rental.records.some(r=>r.month===key);}
function rentSnoozed(){const w=DB.settings.rentWizard||{};return w.snoozedMonth&&!DB.rental.records.some(r=>r.month===w.snoozedMonth)?w.snoozedMonth:null;}
let RW_ID=null,RW_EXPS=[];
function openRentWizard(id){
  if(!DB.rental.tenants.length){toast('Add a tenant first',true);return;}
  const existing=id?DB.rental.records.find(r=>r.id===id):null;
  RW_ID=existing?existing.id:null;
  const sorted=DB.rental.records.slice().sort((a,b)=>a.month.localeCompare(b.month));const last=sorted[sorted.length-1];
  let month,tenantId,mortgage,received,expected,note,exps;
  if(existing){month=existing.month;tenantId=existing.tenantId;mortgage=existing.mortgage||0;received=existing.received||0;
    expected=existing.expected||0;note=existing.note||'';exps=(existing.expenses||[]).map(e=>({label:e.label,amount:e.amount,on:true}));}
  else{
    if(last){const d=new Date(last.month+'-01');d.setMonth(d.getMonth()+1);month=monthStr(d);tenantId=last.tenantId;mortgage=Number(last.mortgage)||0;}
    else{month=monthStr();tenantId=DB.rental.tenants[0].id;mortgage=0;}
    if(DB.rental.records.some(r=>r.month===month))month=monthStr();
    const t=tenantById(tenantId);expected=t?Number(t.contractRent)||0:0;received=expected;note='';
    exps=suggestedExpenses(month).map(e=>({label:e.label,amount:e.amount,on:true}));}
  RW_EXPS=exps; /* labels live in state, not scraped back out of the DOM */
  const costRows=exps.length?exps.map((e,i)=>`<div class="wizrow"><input type="checkbox" id="rw_e${i}" ${e.on?'checked':''}>
      <span class="wl">${esc(e.label)}</span><input class="inp num" id="rw_ea${i}" value="${fmt(e.amount)}"></div>`).join('')
    :'<div class="muted" style="font-size:11.5px">No recurring costs remembered yet — add them in Rental → Recurring costs.</div>';
  $('#modal').innerHTML=`<h3>${existing?'Edit '+month:'Log rent — '+month}</h3>
    <div class="desc">${existing?'Adjust what actually happened this month.':'Pre-filled from last month and your contract. Change only what changed.'}</div>
    <div class="grid2"><div><label class="fl">Month</label><input class="inp" id="rw_m" type="month" value="${month}" ${existing?'disabled':''}></div>
    <div><label class="fl">Tenant</label><select class="inp" id="rw_t">${DB.rental.tenants.map(t=>`<option value="${t.id}" ${t.id===tenantId?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div></div>
    <div class="grid2"><div><label class="fl">Rent received</label><input class="inp num" id="rw_r" value="${fmt(received)}"></div>
    <div><label class="fl">Contract rent</label><input class="inp num" id="rw_x" value="${fmt(expected)}"></div></div>
    <div class="grid2"><div><label class="fl">Mortgage paid</label><input class="inp num" id="rw_g" value="${fmt(mortgage)}"></div>
    <div><label class="fl">Note (needed if it differs)</label><input class="inp" id="rw_n" value="${esc(note)}" placeholder="What is this for?"></div></div>
    <label class="fl" style="margin-top:10px">Recurring costs this month</label>${costRows}

function rwSnooze(){DB.settings.rentWizard=DB.settings.rentWizard||{};DB.settings.rentWizard.snoozedMonth=monthStr();
  closeModal();persist();toast('Snoozed — it is waiting in Attention ⚑');}
function rwSave(n){
  const month=RW_ID?(DB.rental.records.find(r=>r.id===RW_ID)||{}).month:($('#rw_m').value||monthStr());
  if(!month){toast('Pick a month',true);return;}
  const expenses=[];
  for(let i=0;i<n;i++){const cb=$('#rw_e'+i);if(cb&&cb.checked){const amt=parseAmt($('#rw_ea'+i).value);
    const lab=((RW_EXPS[i]||{}).label||'Cost').trim();
    if(amt)expenses.push({label:lab,amount:amt});}}
  const rec={tenantId:$('#rw_t').value,received:parseAmt($('#rw_r').value),expected:parseAmt($('#rw_x').value),
    mortgage:parseAmt($('#rw_g').value),note:$('#rw_n').value.trim(),expenses,u:todayStr()};
  if(RW_ID){const r=DB.rental.records.find(x=>x.id===RW_ID);Object.assign(r,rec);stampHist(r,r.received);}
  else{if(DB.rental.records.some(r=>r.month===month)){toast(month+' is already logged',true);return;}
    DB.rental.records.push(stampHist(Object.assign({id:uid(),month},rec),rec.received));}
  if((DB.settings.rentWizard||{}).snoozedMonth===month)DB.settings.rentWizard.snoozedMonth=null;
  RW_ID=null;closeModal();persist();toast('Saved '+month+' ✓');}

/* ── planner recurring flows: salary, bonuses, subscriptions, school fees ── */
function recurringFlowsFor(key){let i=0,o=0;
  (DB.planner.recurring||[]).forEach(t=>{if(!recurDue(t,key))return;
    const a=Number(t.amount)||0;if(t.kind==='out')o+=a;else i+=a;});
  return{in:i,out:o};}
function planRecPanel(){
  const list=DB.planner.recurring||[];
  const rows=list.length?list.slice().sort((a,b)=>(a.kind===b.kind?0:a.kind==='in'?-1:1)).map(t=>`<tr>
    <td class="l">${t.kind==='in'?'⬇️':'⬆️'} ${esc(t.label)}${t.active===false?' <span class="tag">paused</span>':''}<div class="udate">${t.u||'—'}</div></td>
    <td class="num ${t.kind==='in'?'pos':'neg'}">${fmt(t.amount)}</td>
    <td class="muted" style="font-size:11px">${FREQ_LABEL[t.freq]||t.freq}</td>
    <td class="num muted">${fmt(perMonth(t))}</td>
    <td><button class="x" onclick="openPlanRec('${t.id}')">✏️</button></td><td><button class="x" onclick="delPlanRec('${t.id}')">✕</button></td></tr>`).join('')

  const active=list.filter(t=>t.active!==false);
  const inM=active.filter(t=>t.kind!=='out').reduce((s,t)=>s+perMonth(t),0);
  const outM=active.filter(t=>t.kind==='out').reduce((s,t)=>s+perMonth(t),0);
  return `<div class="panel glass" id="panel_plan_recurring" style="border-left:3px solid var(--pos)"><div class="ph"><span class="swatch" style="background:var(--pos)"></span><h3>Recurring income & costs (real)</h3><span class="sp"></span><button class="btn sm" onclick="openPlanRec()">＋ Recurring</button></div>
    <div class="muted" style="font-size:11.5px;margin-bottom:10px">Salary, bonuses, school fees — real repeating flows. These feed every projection below, unlike the temporary what-if rows.</div>
    <table class="tbl"><thead><tr><th class="l">Item</th><th>Amount (EGP)</th><th>How often</th><th>Per month</th><th></th><th></th></tr></thead><tbody>${rows}</tbody></table>
    <div class="kpi-mini" style="margin-top:10px"><div class="m">Recurring in / mo<b class="num pos">${fmt(inM)}</b></div><div class="m">Recurring out / mo<b class="num neg">${fmt(outM)}</b></div><div class="m">Net / mo<b class="num ${inM-outM>=0?'pos':'neg'}">${signed(inM-outM)}</b></div></div></div>`;}
function openPlanRec(id){
  const t=(DB.planner.recurring||[]).find(x=>x.id===id)||{id:'prc_'+uid(),label:'',amount:0,kind:'in',freq:'monthly',anchor:Number(todayStr().slice(5,7)),start:todayStr(),end:'',active:true};
  const isNew=!(DB.planner.recurring||[]).some(x=>x.id===t.id);
  $('#modal').innerHTML=`<h3>${isNew?'New recurring flow':'Edit recurring flow'}</h3>
    <div class="desc">Money that repeats on a schedule — salary, annual bonus, quarterly fees.</div>
    <label class="fl">Label</label><input class="inp" id="pr_l" value="${esc(t.label)}" placeholder="e.g. Salary / Annual bonus">
    <div class="grid2"><div><label class="fl">Direction</label><select class="inp" id="pr_k"><option value="in" ${t.kind!=='out'?'selected':''}>Money in</option><option value="out" ${t.kind==='out'?'selected':''}>Money out</option></select></div>
    <div><label class="fl">Amount (EGP)</label><input class="inp num" id="pr_a" value="${fmt(t.amount)}"></div></div>
    <div class="grid2"><div><label class="fl">How often</label><select class="inp" id="pr_f">${['monthly','quarterly','annual'].map(f=>`<option value="${f}" ${t.freq===f?'selected':''}>${FREQ_LABEL[f]}</option>`).join('')}</select></div>
    <div><label class="fl">Anchor month (quarterly / annual)</label><input class="inp num" id="pr_m" value="${t.anchor||1}"></div></div>
    <div class="grid2"><div><label class="fl">Starts</label><input class="inp" id="pr_s" type="date" value="${t.start||todayStr()}"></div>
    <div><label class="fl">Ends (optional)</label><input class="inp" id="pr_e" type="date" value="${t.end||''}"></div></div>
    <label class="fl">Status</label><select class="inp" id="pr_st"><option value="1" ${t.active!==false?'selected':''}>Active</option><option value="0" ${t.active===false?'selected':''}>Paused</option></select>
    <div class="mfoot"><button class="btn gho" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="savePlanRec('${t.id}')">Save</button></div>`;
  $('#scrim').classList.add('on');}
function savePlanRec(id){
  const label=$('#pr_l').value.trim();if(!label){toast('Give it a label',true);return;}
  const obj={id,label,kind:$('#pr_k').value,amount:parseAmt($('#pr_a').value),freq:$('#pr_f').value,
    anchor:Math.min(12,Math.max(1,Math.round(parseAmt($('#pr_m').value)||1))),start:$('#pr_s').value||todayStr(),
    end:$('#pr_e').value||'',active:$('#pr_st').value==='1',u:todayStr()};

async function delPlanRec(id){
  const t=(DB.planner.recurring||[]).find(x=>x.id===id);if(!t)return;
  if(!await confirmGlass('Remove recurring flow','“'+t.label+'” stops feeding your projections.',true))return;
  snapUndo();DB.planner.recurring=DB.planner.recurring.filter(x=>x.id!==id);persist();toastUndo('Removed');}

/* ── installment generator ── */
function igRows(){
  const start=$('#ig_s').value||todayStr(),amt=parseAmt($('#ig_a').value),n=Math.max(1,Math.min(120,Math.round(parseAmt($('#ig_n').value)||0)));
  const step=$('#ig_f').value==='quarterly'?3:$('#ig_f').value==='annual'?12:1;
  const esc_=Number(parseAmt($('#ig_e').value))||0;
  const out=[];for(let i=0;i<n;i++){const d=addMonths(new Date(start+'T00:00:00'),i*step);
    out.push({date:d.toISOString().slice(0,10),amount:Math.round(amt*Math.pow(1+esc_/100,i)*100)/100,note:$('#ig_t').value.trim()});}
  return out;}
function igPreview(){const rows=igRows();const tot=rows.reduce((s,r)=>s+r.amount,0);
  const el=$('#ig_prev');if(!el)return;
  el.innerHTML=`<table class="tbl"><tbody>${rows.slice(0,60).map(r=>`<tr><td class="num">${fmtDate(r.date)}</td><td class="num">${fmt(r.amount)}</td></tr>`).join('')}</tbody></table>`;
  const t=$('#ig_tot');if(t)t.textContent=rows.length+' installments · '+fmt(tot)+' EGP total';}
function openInstGen(pid){
  const p=DB.payments.plans.find(x=>x.id===pid);if(!p){toast('Plan not found',true);return;}
  $('#modal').innerHTML=`<h3>Generate installments</h3><div class="desc">Builds a schedule for “${esc(p.title)}”. Review the preview before it is added — nothing existing is removed.</div>
    <div class="grid2"><div><label class="fl">First payment</label><input class="inp" id="ig_s" type="date" value="${todayStr()}" oninput="igPreview()"></div>
    <div><label class="fl">Amount each (EGP)</label><input class="inp num" id="ig_a" value="0" oninput="igPreview()"></div></div>
    <div class="grid2"><div><label class="fl">How many</label><input class="inp num" id="ig_n" value="12" oninput="igPreview()"></div>
    <div><label class="fl">Cadence</label><select class="inp" id="ig_f" onchange="igPreview()"><option value="monthly">Monthly</option><option value="quarterly">Quarterly</option><option value="annual">Annually</option></select></div></div>
    <div class="grid2"><div><label class="fl">Step-up each time (%)</label><input class="inp num" id="ig_e" value="0" oninput="igPreview()"></div>
    <div><label class="fl">Note on each</label><input class="inp" id="ig_t" value="" placeholder="optional" oninput="igPreview()"></div></div>
    <div class="muted" style="font-size:11.5px;margin-top:9px" id="ig_tot">—</div><div class="igprev" id="ig_prev"></div>
    <div class="mfoot"><button class="btn gho" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="igCommit('${p.id}')">Add to plan</button></div>`;
  $('#scrim').classList.add('on');igPreview();}
function igCommit(pid){
  const p=DB.payments.plans.find(x=>x.id===pid);if(!p)return;
  const rows=igRows();if(!rows.length||!rows.some(r=>r.amount>0)){toast('Set an amount first',true);return;}
  snapUndo();rows.forEach(r=>p.installments.push({id:uid(),date:r.date,amount:r.amount,paid:false,note:r.note,u:todayStr()}));
  p.installments.sort((a,b)=>a.date.localeCompare(b.date));
  closeModal();persist();toastUndo(rows.length+' installments added');}

/* ── sandbox: play freely, then Discard or Apply (double-confirm, user ruling) ── */
const SB_KEY=KEY+'_realbackup';
function sandboxOn(){return !!(DB.settings&&DB.settings.sandbox);}
function sandboxBanner(){const b=$('#sbBar');if(!b)return;
  if(!sandboxOn()){b.className='sbbar';b.innerHTML='';return;}
  b.className='sbbar on';
  b.innerHTML=`<span class="dot"></span><span>Sandbox — changes are temporary and never sync</span><span class="sp"></span>
    <button class="btn sm gho" onclick="sandboxDiscard()">Discard</button><button class="btn sm pri" onclick="sandboxApply()">Apply to real</button>`;}
async function sandboxStart(){
  if(sandboxOn())return;
  if(!await confirmGlass('Enter sandbox','Play with any numbers you like. Your real data is backed up on this device and restored the moment you discard. Sync pauses while you are in here.'))return;
  try{localStorage.setItem(SB_KEY,JSON.stringify(DB));}catch(e){toast('Could not back up — sandbox not started',true);return;}
  DB.settings.sandbox=true;persist();sandboxBanner();toast('Sandbox on 🧪');}
async function sandboxDiscard(){
  if(!sandboxOn())return;
  if(!await confirmGlass('Discard sandbox','Throw away every sandbox change and restore your real data?',true))return;
  const raw=localStorage.getItem(SB_KEY);
  if(!raw){toast('Backup missing — staying in sandbox',true);return;}
  DB=migrate(JSON.parse(raw));DB.settings.sandbox=false;localStorage.removeItem(SB_KEY);
  save();applyTheme();applyPrivacy();renderActive();updateBadges();sandboxBanner();toast('Real data restored ✓');}
async function sandboxApply(){
  if(!sandboxOn())return;
  if(!await confirmGlass('Apply sandbox to real data','Everything you changed in the sandbox becomes your real records, and sync resumes.'))return;
  if(!await confirmGlass('Second confirmation','This deletes the pre-sandbox backup. Undo will still cover this one step — after that it is permanent.',true))return;
  snapUndo();DB.settings.sandbox=false;localStorage.removeItem(SB_KEY);
  persist();sandboxBanner();toastUndo('Sandbox applied to real data ✓');}

const CAT_HINTS=[[/cash|wallet|bank|current|saving/i,'💵'],[/stock|equit|share|broker/i,'📈'],[/gold|bullion|metal/i,'🥇'],

function saveCatModal(id){

function openCatPick(it){
